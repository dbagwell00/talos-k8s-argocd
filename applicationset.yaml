apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: talos-appset
  namespace: argocd
spec:
  generators:
    - git:
        directories:
          - path: 'k8s/*/*/overlays/*'
          - path: 'k8s/*/*/overlays/disable'
            exclude: true
        repoURL: https://github.com/dbagwell00/talos-k8s-argocd
        revision: main
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: false
  template:
    metadata:
      # <cluster>-<component>, e.g. talos-mesh-vault
      name: '{{ index .path.segments 4 }}-{{ index .path.segments 2 }}'
    spec:
      destination:
        # overlay dir name must match an ArgoCD-registered cluster name
        name: '{{ index .path.segments 4 }}'
        namespace: default
      project: default
      source:
        path: '{{ .path.path }}'
        repoURL: https://github.com/dbagwell00/talos-k8s-argocd
        targetRevision: main
      ignoreDifferences:
      - group: gateway.networking.k8s.io
        kind: '*'
        jsonPointers:
        - /spec
      # k8s auto-defaults these on StatefulSets; VCTs are immutable post-create,
      # so ignoring their diff is correct (charts don't declare volumeMode/status/etc.)
      - group: apps
        kind: StatefulSet
        jsonPointers:
        - /spec/persistentVolumeClaimRetentionPolicy
        - /spec/volumeClaimTemplates
      # ESO writes status (binding/conditions/refreshTime/syncedResourceVersion)
      # after every sync — never in git, would always be OutOfSync.
      - group: external-secrets.io
        kind: ExternalSecret
        jsonPointers:
        - /status
      # k8s auto-adds `kubernetes.io/metadata.name` on every Namespace; ignored
      # so charts/manifests that don't bake the label don't perma-drift.
      - group: ''
        kind: Namespace
        jsonPointers:
        - /metadata/labels/kubernetes.io~1metadata.name
      syncPolicy:
        # spacetraders: autosync intentionally disabled so the deployment can be
        # manually scaled to 0 without selfHeal reverting it to git's replicas: 1.
        {{- if ne (index .path.segments 2) "spacetraders" }}
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        {{- end }}
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
