# Cilium CNI — STANDALONE Applications (NOT generated by talos-appset).
# Cilium is a multi-source Helm app with custom ignoreDifferences that protect
# the live-patched cilium-config (notably MTU: 1450) + Cilium-managed certs, which
# the appset template can't express. Applied manually:  kubectl apply -f cilium-apps.yaml
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  sources:
  - ref: values
    repoURL: https://github.com/dbagwell00/talos-k8s-argocd
    targetRevision: main
  - chart: cilium
    repoURL: https://helm.cilium.io
    targetRevision: 1.17.2
    helm:
      valueFiles:
      - $values/k8s/infrastructure/cilium/values.yaml
  ignoreDifferences:
  - kind: ConfigMap
    name: cilium-config
    jsonPointers: ["/data"]
  - kind: Service
    name: cilium-ingress
    namespace: kube-system
    jsonPointers: ["/metadata/labels", "/spec/ports"]
  - kind: Secret
    name: cilium-ca
    namespace: kube-system
    jsonPointers: ["/data"]
  - kind: Secret
    name: hubble-relay-client-certs
    namespace: kube-system
    jsonPointers: ["/data"]
  - kind: Secret
    name: hubble-server-certs
    namespace: kube-system
    jsonPointers: ["/data"]
  # --- clustermesh trust material: hand-made (cilium clustermesh connect),
  #     irreplaceable from Git, NEVER overwrite ---
  - kind: Secret
    name: cilium-clustermesh
    namespace: kube-system
    jsonPointers: ["/data"]
  - kind: Secret
    name: cilium-kvstoremesh
    namespace: kube-system
    jsonPointers: ["/data"]
  - kind: Secret
    name: clustermesh-apiserver-admin-cert
    namespace: kube-system
    jsonPointers: ["/data"]
  - kind: Secret
    name: clustermesh-apiserver-local-cert
    namespace: kube-system
    jsonPointers: ["/data"]
  - kind: Secret
    name: clustermesh-apiserver-remote-cert
    namespace: kube-system
    jsonPointers: ["/data"]
  - kind: Secret
    name: clustermesh-apiserver-server-cert
    namespace: kube-system
    jsonPointers: ["/data"]
  syncPolicy:
    # selfHeal TEMPORARILY disabled for clustermesh adoption — re-enabled after
    # `argocd app diff` proves the apiserver/DS won't be disrupted.
    syncOptions:
    - CreateNamespace=false
    - RespectIgnoreDifferences=true
    - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-config
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  source:
    repoURL: https://github.com/dbagwell00/talos-k8s-argocd
    targetRevision: main
    path: k8s/infrastructure/cilium
    directory:
      include: '{ippool.yaml,l2-policy.yaml}'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
