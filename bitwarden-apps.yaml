# Bitwarden — STANDALONE Application (NOT generated by talos-appset).
# Like cilium, it needs custom ignoreDifferences the appset template can't express:
#   - Secret/bitwarden-secretkeys /data  (chart-generated internal keys; overwriting breaks the vault)
#   - Deployment /spec/replicas          (RWO PVCs — replicas managed outside git)
#   - Gateway /spec                      (Cilium mutates it)
# It's a Kustomize+Helm app (self-host 1.0.4, releaseName bitwarden-talos-mesh preserved) plus
# the gateway/cert/network-policy + ExternalSecrets. Applied manually: kubectl apply -f bitwarden-apps.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bitwarden
  namespace: argocd
spec:
  project: default
  destination:
    name: talos-mesh
    namespace: bitwarden
  source:
    repoURL: https://github.com/dbagwell00/talos-k8s-argocd
    targetRevision: main
    path: k8s/apps/bitwarden
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers: ["/spec/replicas"]
  - kind: Secret
    name: bitwarden-secretkeys
    jsonPointers: ["/data"]
  - group: gateway.networking.k8s.io
    kind: "*"
    jsonPointers: ["/spec"]
  syncPolicy:
    # automated enabled only AFTER verified clean adoption.
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
