# Cilium CNI for talos-mesh — STANDALONE Application (NOT generated by talos-appset).
# Adopts the previously hand-installed (raw `helm install`) Cilium on talos-mesh.
#
# Mesh is clustermesh-joined to talos-cilium. The hand-made trust material
# (CA + clustermesh/hubble certs, established out-of-band via `cilium clustermesh
# connect`) lives ONLY in-cluster and cannot be regenerated from Git. Every such
# secret is listed in ignoreDifferences, and RespectIgnoreDifferences=true ensures
# even a sync never overwrites them. Helm therefore manages clustermesh STRUCTURE
# (apiserver Deployment/Service, agent DS volume, cilium-config) while the trust
# secrets stay untouched.
#
# Applied manually:  kubectl apply -f cilium-mesh-apps.yaml
# NOTE: syncPolicy is MANUAL (no automated/selfHeal) until `argocd app diff`
# proves adoption is non-disruptive. selfHeal is enabled only after verification.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-mesh
  namespace: argocd
spec:
  project: default
  destination:
    name: talos-mesh
    namespace: kube-system
  sources:
  - ref: values
    repoURL: https://github.com/dbagwell00/talos-k8s-argocd
    targetRevision: main
  - chart: cilium
    repoURL: https://helm.cilium.io
    targetRevision: 1.17.2
    helm:
      valueFiles:
      - $values/k8s/infrastructure/cilium/values-mesh.yaml
  ignoreDifferences:
  - kind: ConfigMap
    name: cilium-config
    namespace: kube-system
    jsonPointers: ["/data"]
  # --- trust material: hand-made, irreplaceable from Git, NEVER overwrite ---
  - kind: Secret
    name: cilium-ca
    namespace: kube-system
    jsonPointers: ["/data"]
  - kind: Secret
    name: cilium-clustermesh
    namespace: kube-system
    jsonPointers: ["/data"]
  - kind: Secret
    name: hubble-server-certs
    namespace: kube-system
    jsonPointers: ["/data"]
  - kind: Secret
    name: clustermesh-apiserver-admin-cert
    namespace: kube-system
    jsonPointers: ["/data"]
  - kind: Secret
    name: clustermesh-apiserver-local-cert
    namespace: kube-system
    jsonPointers: ["/data"]
  - kind: Secret
    name: clustermesh-apiserver-remote-cert
    namespace: kube-system
    jsonPointers: ["/data"]
  - kind: Secret
    name: clustermesh-apiserver-server-cert
    namespace: kube-system
    jsonPointers: ["/data"]
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    - RespectIgnoreDifferences=true
