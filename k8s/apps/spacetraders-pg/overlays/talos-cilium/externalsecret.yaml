# App-role credentials for the spacetraders PG cluster.
# Vault path: secret/spacetraders/pg
#   username: spacetraders
#   password: <random>
# CNPG's bootstrap.initdb.passwordSecret expects keys `username` + `password`.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: spacetraders-pg-app
  namespace: spacetraders
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: spacetraders-pg-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
  - secretKey: username
    remoteRef:
      key: spacetraders/pg
      property: username
  - secretKey: password
    remoteRef:
      key: spacetraders/pg
      property: password
