# Control API, cluster-internal only (unauthenticated fleet verbs).
apiVersion: v1
kind: Service
metadata:
  name: spacetraders-bw-control
  namespace: spacetraders-bw
spec:
  type: ClusterIP
  selector:
    app: spacetraders-bw
  ports:
  - name: control
    port: 5173
    targetPort: 5173
    protocol: TCP

---
# Read-only dashboard (GET-only listener on 8080) on .142, the address
# TURKEYBOI1's dashboard had (freed 2026-10-08 when spacetraders-sim was
# retired). GOBBLICIDE's is .144.
apiVersion: v1
kind: Service
metadata:
  name: spacetraders-bw-web
  namespace: spacetraders-bw
  annotations:
    io.cilium/lb-ipam-ips: "192.168.4.142"
spec:
  type: LoadBalancer
  selector:
    app: spacetraders-bw
  ports:
  - name: web
    port: 80
    targetPort: 8080
    protocol: TCP
