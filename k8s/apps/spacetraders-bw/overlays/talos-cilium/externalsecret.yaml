# Only the ACCOUNT_TOKEN is read from Vault, from the existing
# secret/spacetraders/agent-erl path (same account as GOBBLICIDE). The agent
# has no AGENT_TOKEN on purpose: at boot st_reset finds no token in its own
# database (spacetraders_bw), registers BLOODWATTLE into ST_FACTION, and
# persists the token there. AGENT_SYMBOL and ST_FACTION are plain env in
# deployment.yaml, so no new Vault path is needed to start it.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: spacetraders-bw-agent
  namespace: spacetraders-bw
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: spacetraders-bw-agent
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: ACCOUNT_TOKEN
    remoteRef:
      key: spacetraders/agent-erl
      property: ACCOUNT_TOKEN
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
