# BLOODWATTLE: the spacetraders-erlang agent (same image and policy flags as
# spacetraders-erl / GOBBLICIDE), in the SHADOW faction, replacing TURKEYBOI1.
#
# **Egress is the node IP, NOT the VPN.** The API rate limit is per IP; the
# VPN egress is GOBBLICIDE's budget, and the node IP was TURKEYBOI1's, which
# is why ../../spacetraders/ is scaled to 0 in the same change. Never run this
# and the Python agent at once: they would split one budget.
#
# Everything else -- probes, resources, the PVC, Recreate -- mirrors
# spacetraders-erl/deployment.yaml; the reasoning lives in its comments.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spacetraders-bw
  namespace: spacetraders-bw
  labels:
    app: spacetraders-bw
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: spacetraders-bw
  template:
    metadata:
      labels:
        app: spacetraders-bw
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      securityContext:
        fsGroup: 10001
      initContainers:
      - name: record-perms
        # CephFS mounts root-owned 755 and, unlike the RBD data volume, does not
        # take fsGroup: without this the recorder (uid 10001) cannot write a
        # byte (live 2026-10-12: 81 lines dropped in the first 30 s).
        image: busybox
        command: ["sh", "-c", "chown 10001:10001 /record && chmod 2775 /record"]
        volumeMounts:
        - name: record
          mountPath: /record
      containers:
      - name: agent
        image: registry.dlb.im/spacetraders-erlang:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5173
          name: control
        - containerPort: 8080
          name: web
        env:
        # Identity. No AGENT_TOKEN and no ST_HQ: with only ACCOUNT_TOKEN the
        # agent registers BLOODWATTLE into SHADOW at boot (st_reset:converge/0),
        # persists the token to spacetraders_bw, and reads its HQ from the
        # agent record. SHADOW is TURKEYBOI1's faction; this pod replaces it.
        - name: AGENT_SYMBOL
          value: BLOODWATTLE
        - name: ST_FACTION
          value: SHADOW
        - name: ACCOUNT_TOKEN
          valueFrom:
            secretKeyRef:
              name: spacetraders-bw-agent
              key: ACCOUNT_TOKEN
        # The analytical record: trade ledger, price history, order outcomes,
        # and the agent-token store that makes reset recovery automatic.
        # ETS stays the source of truth; losing this degrades history, not
        # trading (st_history buffers and reconnects).
        - name: PG_USER
          valueFrom:
            secretKeyRef:
              name: spacetraders-bw-pg
              key: username
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: spacetraders-bw-pg
              key: password
        - name: ST_PG_URL
          value: "postgresql://$(PG_USER):$(PG_PASSWORD)@spacetraders-pg-rw.spacetraders.svc:5432/spacetraders_bw"
        # The alliance (spacetraders-erlang st_ally): GOBBLICIDE and BLOODWATTLE
        # publish their HQs and the systems their haulers work, and neither
        # sends a hauler or a charting probe into the other's side (nearest HQ
        # wins, claims of worked systems beat that). Shared by both agents;
        # unset turns the rule off. /live/ally shows what it blocked.
        - name: ST_ALLY_PG_URL
          value: "postgresql://$(PG_USER):$(PG_PASSWORD)@spacetraders-pg-rw.spacetraders.svc:5432/spacetraders_alliance"
        # Every agent's credits + hulls every 5 min into the alliance DB for the
        # Grafana Leaderboard dashboard (spacetraders-erlang st_leaderboard).
        # ONE collector for the alliance: BLOODWATTLE only, GOBBLICIDE stays off.
        - name: ST_LEADERBOARD
          value: "on"
        - name: ST_DATA_DIR
          value: /data
        # The flight recorder (st_recorder): replayable inputs for every decision.
        - name: ST_RECORD_DIR
          value: /record
        # 32 dated from the first deploy (a handful of hulls). Live 2026-10-07 at
        # 1,155 hulls: 32/32 running, ~320 queued, trade orders waiting ~95 s for
        # a slot, probes (class 2) admitted 25 times in 19 h. The limiter is the
        # real cap on calls; slots only decide who may queue for one.
        - name: ST_WORKER_POOL_SIZE
          value: "128"
        - name: ST_TICK_MS
          value: "5000"
        # whater's fleet cap: no trade hull past the sum of per-system
        # targets. Off by default in the image (#269); live 2026-09-26 the
        # agent bought 52 refining freighters (~139M) into one system,
        # earning ~6k/hr each against ~50k/hr for a light freighter.
        - name: ST_POLICY_TRADER_FLEET_CAP
          value: "on"
        # spacetraders-erlang #353: the pump buys only healthy exports/exchanges
        - name: ST_POLICY_PUMP_HEALTHY_SOURCES
          value: "on"
        # spacetraders-erlang #354: a feed ends by reading the factory it fed
        - name: ST_POLICY_PUMP_READS_FACTORY
          value: "on"
        # The land-grab bundle (spacetraders-erlang #298): pre-gate yard survey
        # by market signature + gate watch, asteroids last, relay density one
        # probe per system, relay batch buys, no home restock post-gate.
        # Sim A/B 2026-10-04 (28 paired seeds, h0-h72): net worth +161%,
        # 28/28; credits at gate+24h 56M -> 152M.
        - name: ST_POLICY_LAND_GRAB
          value: "on"
        # Reserve the book's next cargo hull (the light hauler), not the shuttle,
        # so the gate arm stops draining the treasury below it (spacetraders-erlang
        # #301). A/B n=28 default export row: CY17 gate h35 -> h23, credits +321%;
        # GS46 -0.4 h (FAB-capped world). Needs the #301 image.
        - name: ST_POLICY_BOOK_RESERVE
          value: "on"
        # Buy traders through the post-gate charting surge instead of
        # backfilling after it: the first traders into a system get its fat
        # lanes (spacetraders-erlang #304). Live 2026-10-06 the defer held 4
        # haulers on 15.4M. Fleet cap still bounds the count. Needs the #304 image.
        - name: ST_POLICY_SURGE_TRADERS
          value: "on"
        # Drop calls for information already held: the pre-jump gate read,
        # the post-sell market read, the dock around a skipped top-up -- ~17% of
        # live calls (spacetraders-erlang #305, SPEC 4.2a). A/B n=12 from the
        # live 800-hull fleet: net worth +6.8% (CI +6.0..+7.7%). Needs the #305 image.
        - name: ST_POLICY_API_LEAN
          value: "on"
        # Remember a hauler's "no route" until its system's markets change,
        # it moves, or 60 s pass (spacetraders-erlang #306, SPEC 3.3.3).
        # propose_trade was ~1.4 s of a ~2 s tick. Needs the #306 image.
        - name: ST_POLICY_NO_ROUTE_CACHE
          value: "on"
        # TAYSUUS's strategy: bulk freighters on roaming cross-system routes,
        # credits per request (spacetraders-erlang #319). Implies roam_trade;
        # post-gate only. Buys SHIP_BULK_FREIGHTER, scraps 6 light freighters
        # per bulk hull. A/B runs/ab-bulk-r2-h8-n12 (n=12, 8 h, live fleet):
        # net worth +5.1% (sign-flip p 0.036), credits +20.2%. Needs the #319 image.
        - name: ST_POLICY_BULK_HULLS
          value: "on"
        # A roaming hauler in a dead end moves to the best system it may trade
        # in within 12 jumps (spacetraders-erlang #320). For BLOODWATTLE, boxed
        # in by GOBBLICIDE's claims near home. A/B n=12: net worth +2.1% (n.s.),
        # credits +5.7% (CI +1.2..+9.9%). Needs the #320 image.
        - name: ST_POLICY_ROAM_REPOSITION
          value: "on"
        # Roam radius 1 jump (default 4). Measured on BW's 10-25 reset: roam took
        # 81% of trade ship-hours; realized/ship-h 0j 1.8M, 1j 549k, 2j 275k,
        # 3-4j ~154k, 5+j 96k vs in-system trade 1.25M / tour 988k. Roam over 1
        # jump realized 42-53% of its predicted rate. Not A/B'd: live change.
        - name: ST_ROAM_HOPS
          value: "1"
        # Probes on every market under the roam region, slack-only (IDLE tier),
        # shared across the alliance line (spacetraders-erlang SPEC 6.3.7).
        - name: ST_POLICY_MARKET_WATCH
          value: "on"
        # T5 beams + Time To Hauler: vanguard hulls beam to the nearest likely T5
        # systems and buy the first hauler at the T5's yard; each beam reads its
        # own gate on arrival (spacetraders-erlang #357). Sim A/Bs (n=12, h48):
        # beams on vs off +10.2% net worth (CI +2.1..+18.5), gate read +9.5%,
        # T5s with a hauler by h48 48/60 -> 58/60. Needs the #357 image.
        - name: ST_POLICY_T5_BEAM
          value: "on"
        - name: ST_POLICY_BEAM_READ_GATE
          value: "on"
        # TTH + shared gate graph (spacetraders-erlang #358, #359; image a5fd51e).
        # Sim A/Bs (RV5, n=12, pre-registered): the T5 hauler buy skips the
        # in-flight cap: TTH -0.96 h (11/12, p 0.0005). Beam waves keep 5 T5
        # targets open all reset: net worth +7.3% at h72 (CI +1.4..+14.0), T5s
        # with a hauler 5 -> 13.9. read_gates is neutral in the sim (+0.2%,
        # ~40 extra gate reads a run); with ally_edges every gate edge our ships
        # learn goes to the alliance graph, which the other agent re-reads every
        # 5 min. Both agents need ally_edges (the reader scopes by reset_id).
        - name: ST_POLICY_TTH_NO_PIPELINE
          value: "on"
        - name: ST_POLICY_BEAM_WAVES
          value: "on"
        - name: ST_POLICY_READ_GATES
          value: "on"
        - name: ST_POLICY_ALLY_EDGES
          value: "on"
        # Other agents' trades in the markets we read (spacetraders-erlang #366):
        # kept from each market read's transaction list (no extra calls) for
        # /live/competitors and the competitor_trades table. ~40% of the trades
        # in our markets are other agents' (GOB sample, 2026-10-18).
        - name: ST_POLICY_COMPETITOR_WATCH
          value: "on"
        # Price the markets nobody has read (GOB has run this since argocd #85).
        # BW lacked it: reset 10-18 h2.3, 10 of 26 home markets unread vs GOB's
        # 0, operating profit 110k/h vs GOB's 375k/h and the book 35 min behind.
        - name: ST_POLICY_TRADER_SCOUT
          value: "on"
        # TB1's gate floor (spacetraders-erlang st_capital:tb1_gate_floor/0):
        # pre-gate the gate may spend down to max(150k, 50k + the pending light
        # hauler) instead of trade working capital + hull reserve (580-700k).
        # Corrected sim (#360-#364), these policies, 5 live homes x 3 seeds,
        # 30 h: worst gate h23/h24/h21 -> h20/h22/h20, mean -0.87 h (10 better,
        # 3 worse, 2 same), net worth at h30 +12.4 %; no run past h22.
        # OFF since 2026-10-19: live 10-18 (its first reset) froze both fleets at
        # 5 cargo hulls from h1 -- the gate spent down to ~354k while a book light
        # hauler needs ~600k (trade working capital + price), so it never bought;
        # FAB_MATS inputs went unfed, the factory starved from h12, gates ~h29/~h35
        # vs h23.4/h27.4 the week before with it off. The sim missed it: its
        # FAB_MATS factory never starves (spacetraders-erlang
        # docs/failures/2026-10-19-ab-baseline-missed-live-policies.md).
        # 10-25 A/B (spacetraders-erlang docs/experiments/2026-10-25-gate-floor-ab.md)
        # CANCELLED 2026-10-24 by the user: both agents run floor OFF, as GOBBLICIDE5/6
        # did (gates h21.1 / h20.1).
        - name: ST_POLICY_TB1_GATE_FLOOR
          value: "off"
        # Unlike the Python agent, this one is genuinely parallel: the BEAM
        # runs the planner and every worker across all schedulers. So a CPU
        # limit here would actually bite, where on the Python pod it was
        # meaningless. Kept modest because the binding resource is still the
        # ~2.44 req/s API budget, not compute.
        # **512Mi OOM-killed this pod 51 times in 11 hours** (2026-09-17,
        # exitCode 137, roughly one kill every five minutes). The readiness
        # failures that surfaced it were downstream of the restart, not a
        # cause.
        #
        # It is not a leak and it is not live data. Measured on the pod 25
        # seconds after boot: 364Mi total, 288Mi of it PROCESS HEAP against
        # 34Mi of ETS -- and a forced GC across all processes took total
        # 276Mi -> 134Mi, processes 202Mi -> 68Mi. `st_planner`, the biggest
        # single holder at 93Mi, has an actual state of 7KB.
        #
        # The BEAM cannot see this cgroup limit, so it grows toward a ceiling
        # it does not know about and the kernel kills it. Two retention sites:
        # the four control-API acceptors block in `prim_inet:accept0` after
        # serving a response and never allocate again, so they never GC (27Mi
        # each, 108Mi total, idle); and the periodic planners allocate a large
        # working set per pass that the generational collector promotes rather
        # than reclaims.
        #
        # This is headroom, not the fix. The fix is `erlang:garbage_collect/0`
        # in the acceptor loop and `hibernate` on the periodic gen_servers,
        # which is what would make 512Mi correct rather than merely tight.
        # Revisit this number once that ships.
        #
        # The request moves with it: 128Mi against a real steady state of
        # ~134Mi post-GC gave the pod Burstable QoS at the bottom of the
        # eviction order, which is the wrong place for the only thing in this
        # namespace that earns anything. Node has the room -- memory requests
        # were at 21% of allocatable when this was written.
        #
        # **2026-09-26: 1Gi -> 2Gi.** Two OOMKills at 07:47 and 07:48 UTC (the
        # second 66 s into its own boot) and one at 01:46, with the fleet at
        # 188 ships: steady state ~650Mi, `st_persist` alone holding ~110Mi of
        # garbage after each 60 s snapshot, and boot (snapshot load + recon
        # seed + ~90 resumed orders at once) the peak. The request follows the
        # real steady state. Node memory was 25-41% used when this was written.
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: "4"
            # memory 2Gi -> 4Gi, request 512Mi -> 1Gi (2026-10-25): BLOODWATTLE
            # OOMKilled 5x in 14 h at the week-end fleet (last 04:49 UTC, 36 min
            # after its own restart; 1.34Gi 94 min after that); GOBBLICIDE 639Mi.
            # Steady state 0.6-1.3Gi, so the request follows it. talos-cilium-1
            # memory was 56% used when this was written.
            memory: 4Gi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: record
          mountPath: /record
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5173
          initialDelaySeconds: 20
          periodSeconds: 30
          failureThreshold: 4
        readinessProbe:
          httpGet:
            path: /readyz
            port: 5173
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: spacetraders-bw-data
      - name: record
        persistentVolumeClaim:
          claimName: spacetraders-bw-record
