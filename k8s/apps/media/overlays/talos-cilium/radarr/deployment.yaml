apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: media
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: kube-system/vpn-client-network
        sidecar.istio.io/inject: "false"
        backup.velero.io/backup-volumes-excludes: media
      labels:
        app: radarr
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      initContainers:
      - name: fix-routes
        image: busybox
        command:
        - sh
        - -c
        - |
          ETH0_GW=$(ip route | grep "default.*eth0" | awk '{print $3}')
          ip route add 10.0.0.0/8 via $ETH0_GW dev eth0 || true
          ip route add 192.168.4.0/24 via $ETH0_GW dev eth0 || true
          ip route add 192.168.1.0/24 via $ETH0_GW dev eth0 || true
          # /32 host routes for node internal IPs - override net1's directly
          # connected 192.168.3.0/24 route so Cilium LB SNAT replies go
          # back through eth0 (Cilium) instead of net1 (multus VPN)
          ip route add 192.168.3.20/32 via $ETH0_GW dev eth0 || true
          ip route add 192.168.3.22/32 via $ETH0_GW dev eth0 || true
          ip route add 192.168.3.24/32 via $ETH0_GW dev eth0 || true
          ip route add 192.168.3.26/32 via $ETH0_GW dev eth0 || true
          ip route del default via $ETH0_GW dev eth0 || true
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
      containers:
      - name: radarr
        image: ghcr.io/linuxserver/radarr:develop
        ports:
        - containerPort: 7878
          name: http
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "997"
        - name: TZ
          value: US/Pacific
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /media
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: radarr-config
      - name: media
        persistentVolumeClaim:
          claimName: media-downloads
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 192.168.3.254
        - 10.96.0.10
        searches:
        - media.svc.cluster.local
        - svc.cluster.local
        - cluster.local
        options:
        - name: ndots
          value: "5"
