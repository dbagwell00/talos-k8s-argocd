# Vault path: secret/spacetraders/redis
#   password: <random>
# Bitnami redis chart reads `auth.existingSecret` + `auth.existingSecretPasswordKey=redis-password`.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: spacetraders-redis
  namespace: spacetraders
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: spacetraders-redis
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: redis-password
    remoteRef:
      key: spacetraders/redis
      property: password
