# Vault path: secret/spacetraders/redis  (key: password)
# Exposes two derived secret keys:
#   redis-password      raw — consumed by Bitnami redis chart (auth.existingSecretPasswordKey)
#                       and by clients using host+pw kwargs
#   redis-password-url  urlquery-encoded — for `redis://:<pw>@host:6379` composition
#                       (raw password contains '/' and '+', breaks URL parsing otherwise)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: spacetraders-redis
  namespace: spacetraders
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: spacetraders-redis
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        redis-password: "{{ .password }}"
        redis-password-url: "{{ .password | urlquery }}"
  data:
  - secretKey: password
    remoteRef:
      key: spacetraders/redis
      property: password
