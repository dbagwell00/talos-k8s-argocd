apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
- name: redis
  repo: https://charts.bitnami.com/bitnami
  version: 20.6.2
  releaseName: spacetraders-redis
  namespace: spacetraders
  valuesInline:
    # Required when overriding images off docker.io/bitnami/*
    global:
      security:
        allowInsecureImages: true
    architecture: standalone
    fullnameOverride: spacetraders-redis
    # Bitnami moved free-tier images out of docker.io/bitnami/* in late 2025;
    # the chart's pinned tag no longer exists. Point at bitnamilegacy instead.
    image:
      registry: docker.io
      repository: bitnamilegacy/redis
      tag: 7.4.3-debian-12-r0
    kubectl:
      image:
        registry: docker.io
        repository: bitnamilegacy/kubectl
        tag: 1.33.3-debian-12-r0
    sentinel:
      image:
        registry: docker.io
        repository: bitnamilegacy/redis-sentinel
        tag: 7.4.3-debian-12-r0
    auth:
      enabled: true
      existingSecret: spacetraders-redis
      existingSecretPasswordKey: redis-password
    master:
      persistence:
        enabled: true
        storageClass: ceph-rbd
        size: 4Gi
      # All-CP cluster
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
      # LAN-exposed for the WSL/Windows host
      service:
        type: LoadBalancer
        annotations:
          io.cilium/lb-ipam-ips: "192.168.4.141"
        ports:
          redis: 6379
    metrics:
      enabled: false

resources:
- namespace.yaml
- externalsecret.yaml
- network-policy.yaml
