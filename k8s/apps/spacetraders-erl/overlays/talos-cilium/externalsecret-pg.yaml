# PostgreSQL credentials for the Erlang agent's analytical record.
#
# Pulled from Vault directly rather than reusing the `spacetraders-pg-app`
# secret CNPG maintains: that one lives in the `spacetraders` namespace and
# Kubernetes secrets do not cross namespaces. Same Vault path, same role — the
# agent connects to its own database (`spacetraders_erl`) on the shared
# cluster, so it cannot collide with the Python agent's schema.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: spacetraders-erl-pg
  namespace: spacetraders-erl
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: spacetraders-erl-pg
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: username
    remoteRef:
      key: spacetraders/pg
      property: username
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: password
    remoteRef:
      key: spacetraders/pg
      property: password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
