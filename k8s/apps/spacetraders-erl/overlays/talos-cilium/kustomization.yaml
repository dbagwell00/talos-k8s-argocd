apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No namespace.yaml here on purpose: the `spacetraders` Namespace is declared
# by the `spacetraders` app's overlay. Two ArgoCD Applications declaring the
# same Namespace object fight over it forever.
resources:
- externalsecret.yaml
- deployment.yaml
- service.yaml
- network-policy.yaml
