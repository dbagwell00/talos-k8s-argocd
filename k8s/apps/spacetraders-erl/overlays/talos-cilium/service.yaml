# Control API, cluster-internal only.
#
# ClusterIP and not LoadBalancer, for the same reason as the Python agent's
# `spacetraders-control`: the control verbs mutate the fleet (pause, tick,
# save) and there is no authentication in front of them. Reaching it from a
# laptop is `kubectl port-forward`, deliberately.
apiVersion: v1
kind: Service
metadata:
  name: spacetraders-erl-control
  namespace: spacetraders-erl
spec:
  type: ClusterIP
  selector:
    app: spacetraders-erl
  ports:
  - name: control
    port: 5173
    targetPort: 5173
    protocol: TCP
