# Two ingress rules, matching the agent's two listeners.
#
# 5173 (control -- pause, tick, save) stays cluster-only: it has no
# authentication and its verbs stop the fleet.
#
# 8080 (read-only dashboard) additionally allows `world`, because the LAN
# LoadBalancer on 192.168.4.144 SNATs to the pod CIDR and Cilium classifies
# that as world. The listener itself refuses every non-GET method, so what
# `world` can reach here is reads and nothing else.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-spacetraders-erl-control
  namespace: spacetraders-erl
spec:
  endpointSelector:
    matchLabels:
      app: spacetraders-erl
  ingress:
  - fromEntities:
    - cluster
    toPorts:
    - ports:
      - port: "5173"
        protocol: TCP
  - fromEntities:
    - cluster
    - world
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
# NOTE: no egress policy. This pod's egress does not go through Cilium at all
# for anything but cluster-local traffic -- the default route is on the multus
# macvlan interface pointing at the VPN gateway, so a Cilium egress policy
# would be policing the wrong path and would mainly serve to break DNS. The
# actual egress control is gluetun's own firewall (FIREWALL_OUTBOUND_SUBNETS).
