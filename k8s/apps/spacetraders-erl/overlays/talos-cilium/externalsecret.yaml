# Vault path: secret/spacetraders/agent-erl
#   AGENT_TOKEN, AGENT_SYMBOL, ST_HQ, ACCOUNT_TOKEN
#
# ACCOUNT_TOKEN is what lets the agent survive the weekly server reset without
# a human. AGENT_TOKEN is only a BOOTSTRAP value now: on the first reset the
# agent re-registers, persists the new token to its own database, and prefers
# that from then on -- so this secret's copy is expected to go stale and
# nothing needs to update it.
#
# Deliberately a SEPARATE path from secret/spacetraders/agent. The two agents
# are two distinct players on the same account; sharing a secret would mean a
# re-registration of one silently repointing the other at the wrong callsign.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: spacetraders-erl-agent
  namespace: spacetraders-erl
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: spacetraders-erl-agent
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
  - extract:
      key: spacetraders/agent-erl
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
