apiVersion: apps/v1
kind: Deployment
metadata:
  name: spacetraders-erl
  namespace: spacetraders-erl
  labels:
    app: spacetraders-erl
spec:
  replicas: 0 
  # Single-writer, same as the Python agent: the planner assumes exactly one
  # instance. Recreate avoids two pods racing on the API budget and on the
  # agent's own fleet during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: spacetraders-erl
  template:
    metadata:
      annotations:
        # ── VPN egress ──────────────────────────────────────────────────
        # A second interface (net1) on the 192.168.3.0/24 macvlan, whose
        # gateway is the gluetun pod at .254. This is the whole reason the
        # Erlang agent exists as a separate deployment from the Python one:
        # its game traffic leaves through the VPN, not through the node.
        k8s.v1.cni.cncf.io/networks: kube-system/vpn-client-network
      labels:
        app: spacetraders-erl
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      # The agent runs as uid/gid 10001 (`stagent`), and a freshly provisioned
      # RBD volume mounts root-owned 755. Without fsGroup the kubelet never
      # chowns it, `st_persist:ensure_dir/0` cannot create its directory, and
      # it takes the deliberate soft-fail path -- "data dir unusable;
      # snapshots disabled" at warning level -- leaving the agent in exactly
      # the cold-start state this volume exists to end, but now silently and
      # with a PVC attached to prove otherwise.
      #
      # The emptyDir never needed this: it is created 0777.
      securityContext:
        fsGroup: 10001
      initContainers:
      # Multus gives us net1 but leaves eth0's default route in place, so
      # everything would still leave via the node. This rewrites the table:
      # keep cluster and LAN traffic on eth0 (Cilium), then drop eth0's
      # default so the only remaining default is net1 -> 192.168.3.254 -> VPN.
      #
      # The /32 host routes for the node IPs are load-bearing and easy to miss:
      # net1 has a directly-connected 192.168.3.0/24 route, which would swallow
      # the node addresses too, and replies to Cilium's LB SNAT would go out
      # the VPN interface and never arrive.
      - name: fix-routes
        image: busybox
        command:
        - sh
        - -c
        - |
          ETH0_GW=$(ip route | grep "default.*eth0" | awk '{print $3}')
          ip route add 10.0.0.0/8 via $ETH0_GW dev eth0 || true
          ip route add 192.168.4.0/24 via $ETH0_GW dev eth0 || true
          ip route add 192.168.1.0/24 via $ETH0_GW dev eth0 || true
          ip route add 192.168.3.20/32 via $ETH0_GW dev eth0 || true
          ip route add 192.168.3.22/32 via $ETH0_GW dev eth0 || true
          ip route add 192.168.3.24/32 via $ETH0_GW dev eth0 || true
          ip route add 192.168.3.26/32 via $ETH0_GW dev eth0 || true
          ip route del default via $ETH0_GW dev eth0 || true
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
      containers:
      - name: agent
        image: registry.dlb.im/spacetraders-erlang:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5173
          name: control
        - containerPort: 8080
          name: web
        env:
        # Agent identity (from Vault via ExternalSecret).
        - name: AGENT_TOKEN
          valueFrom:
            secretKeyRef:
              name: spacetraders-erl-agent
              key: AGENT_TOKEN
        - name: AGENT_SYMBOL
          valueFrom:
            secretKeyRef:
              name: spacetraders-erl-agent
              key: AGENT_SYMBOL
        # Headquarters waypoint; the home system is derived from it.
        - name: ST_HQ
          valueFrom:
            secretKeyRef:
              name: spacetraders-erl-agent
              key: ST_HQ
        # The faction to register with. It decides the STARTING SYSTEM, so it
        # decides which universe the agent wakes up in -- including whether
        # that system's jump gate is already built by an established agent.
        #
        # This key has been in the Vault secret all along and was never mapped
        # into the pod, so `st_config:faction/0` fell through to its "COSMIC"
        # default on every registration. Found 2026-09-10: the secret said
        # VOID, the agent registered COSMIC, and landed in X1-F62 next to
        # HYDRA (32 ships, 14.4M credits) whose gate was already COMPLETE --
        # so the whole pre-gate phase was unreachable.
        - name: ST_FACTION
          valueFrom:
            secretKeyRef:
              name: spacetraders-erl-agent
              key: ST_FACTION
        # The account-level token, used ONLY to re-register after a weekly
        # reset. Without it the agent detects the reset, closes its writer
        # gate and holds -- correct, but it needs a human to get going again.
        - name: ACCOUNT_TOKEN
          valueFrom:
            secretKeyRef:
              name: spacetraders-erl-agent
              key: ACCOUNT_TOKEN
              optional: true
        # The analytical record: trade ledger, price history, order outcomes,
        # and the agent-token store that makes reset recovery automatic.
        # ETS stays the source of truth; losing this degrades history, not
        # trading (st_history buffers and reconnects).
        - name: PG_USER
          valueFrom:
            secretKeyRef:
              name: spacetraders-erl-pg
              key: username
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: spacetraders-erl-pg
              key: password
        - name: ST_PG_URL
          value: "postgresql://$(PG_USER):$(PG_PASSWORD)@spacetraders-pg-rw.spacetraders.svc:5432/spacetraders_erl"
        - name: ST_DATA_DIR
          value: /data
        - name: ST_WORKER_POOL_SIZE
          value: "32"
        - name: ST_TICK_MS
          value: "5000"
        # Unlike the Python agent, this one is genuinely parallel: the BEAM
        # runs the planner and every worker across all schedulers. So a CPU
        # limit here would actually bite, where on the Python pod it was
        # meaningless. Kept modest because the binding resource is still the
        # ~2.44 req/s API budget, not compute.
        # **512Mi OOM-killed this pod 51 times in 11 hours** (2026-09-17,
        # exitCode 137, roughly one kill every five minutes). The readiness
        # failures that surfaced it were downstream of the restart, not a
        # cause.
        #
        # It is not a leak and it is not live data. Measured on the pod 25
        # seconds after boot: 364Mi total, 288Mi of it PROCESS HEAP against
        # 34Mi of ETS -- and a forced GC across all processes took total
        # 276Mi -> 134Mi, processes 202Mi -> 68Mi. `st_planner`, the biggest
        # single holder at 93Mi, has an actual state of 7KB.
        #
        # The BEAM cannot see this cgroup limit, so it grows toward a ceiling
        # it does not know about and the kernel kills it. Two retention sites:
        # the four control-API acceptors block in `prim_inet:accept0` after
        # serving a response and never allocate again, so they never GC (27Mi
        # each, 108Mi total, idle); and the periodic planners allocate a large
        # working set per pass that the generational collector promotes rather
        # than reclaims.
        #
        # This is headroom, not the fix. The fix is `erlang:garbage_collect/0`
        # in the acceptor loop and `hibernate` on the periodic gen_servers,
        # which is what would make 512Mi correct rather than merely tight.
        # Revisit this number once that ships.
        #
        # The request moves with it: 128Mi against a real steady state of
        # ~134Mi post-GC gave the pod Burstable QoS at the bottom of the
        # eviction order, which is the wrong place for the only thing in this
        # namespace that earns anything. Node has the room -- memory requests
        # were at 21% of allocatable when this was written.
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /data
        # Liveness is "the VM answers", not "the agent is trading". Tying it to
        # trading gets the pod killed during a game outage, which is exactly
        # when a restart helps least.
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5173
          initialDelaySeconds: 20
          periodSeconds: 30
          failureThreshold: 4
        # Readiness asks the PLANNER, which is the difference that matters.
        #
        # /healthz is deliberately dumb -- it returns 200 if the VM answers,
        # touching nothing else -- and that is right for liveness above: tying
        # a restart to "is the agent trading" kills the pod during a game
        # outage, which is when restarting helps least.
        #
        # But it was on readiness too, so nothing anywhere asked whether the
        # agent was actually planning. Measured 2026-09-15 (GOBBLICIDE): the
        # planner tick ran 16,943ms against a 5,000ms interval, so it was never
        # idle; every /live/* route that needs st_planner:snapshot/0 is a 5s
        # gen_server:call and timed out, and the dashboard served its shell
        # with every panel blank. This pod read 1/1 Running the whole time --
        # 111 minutes -- because the only question being asked was one the
        # planner is not involved in answering.
        #
        # /readyz asks the planner and answers 503 when it does not reply, so
        # a wedged planner now shows as NotReady instead of healthy.
        # Deliberately NOT also the liveness path: a slow tick should take the
        # pod out of service, not restart it in a loop.
        readinessProbe:
          httpGet:
            path: /readyz
            port: 5173
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      # A real volume, because the snapshot was never read back.
      #
      # This was an emptyDir on the reasoning that "every byte of it is
      # re-derivable from the API. Losing it on reschedule costs one bootstrap,
      # not correctness." Re-derivable it is; cheap it is not. `st_persist`
      # snapshots every 60s and loads before the first tick, so the agent was
      # always doing its half -- and every file it ever wrote was thrown away
      # with the pod.
      #
      # Measured across three rolls on 2026-09-16: reachability came back
      # `status: cold, reachable: 1` each time, the vanguard read
      # `frontier_remains: false`, and charting -- the largest income line at
      # ~23k a call -- produced nothing for the first fifteen minutes while the
      # gate graph rebuilt against an IP-wide rate limit. See pvc.yaml.
      - name: data
        persistentVolumeClaim:
          claimName: spacetraders-erl-data
      # Multus removed eth0's default route, so the pod cannot reach the
      # cluster DNS service the normal way at the moment resolv.conf is
      # written. Point at gluetun first (it forwards to 1.1.1.1 through the
      # tunnel, which is what keeps DNS lookups for api.spacetraders.io inside
      # the VPN), with kube-dns as the fallback for in-cluster names.
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 192.168.3.254
        - 10.96.0.10
        searches:
        - spacetraders-erl.svc.cluster.local
        - svc.cluster.local
        - cluster.local
        options:
        - name: ndots
          value: "5"
