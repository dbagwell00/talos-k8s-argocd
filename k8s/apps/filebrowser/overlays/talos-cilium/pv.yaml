apiVersion: v1
kind: PersistentVolume
metadata:
  name: smb-mnt
spec:
  capacity:
    storage: 100Ti
  accessModes:
  - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
  - dir_mode=0777
  - file_mode=0777
  - vers=3.0
  - uid=0
  - gid=0
  csi:
    driver: smb.csi.k8s.io
    readOnly: false
    volumeHandle: smb-mnt-unique
    volumeAttributes:
      source: "//smb.local/mnt"
    nodeStageSecretRef:
      name: samba-creds
      namespace: media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smb-mnt
  namespace: filebrowser
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 100Ti
  volumeName: smb-mnt
  storageClassName: ""
