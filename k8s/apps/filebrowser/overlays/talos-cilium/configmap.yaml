apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: filebrowser
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;

        server {
            listen 80;
            server_name _;

            location / {
                root /mnt/mnt;
                autoindex on;
                autoindex_exact_size off;
                autoindex_localtime on;
            }
        }
    }
