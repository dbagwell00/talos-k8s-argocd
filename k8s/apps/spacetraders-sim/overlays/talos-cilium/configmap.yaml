apiVersion: v1
kind: ConfigMap
metadata:
  name: spacetraders-sim-nginx
  namespace: spacetraders-sim
data:
  default.conf: |
    # Static files on CephFS. GET for everyone who can reach it (the LAN, and
    # spacetraders-fed's proxy); PUT/DELETE/MKCOL need the publisher's login.
    # autoindex as JSON is the experiment listing the viewer reads.
    server {
      listen 8080;
      root /data;
      client_max_body_size 512m;
      gzip on;
      gzip_types application/json text/html application/javascript;
      gzip_min_length 1024;
      location = /healthz { access_log off; return 200 "ok\n"; }
      location / {
        autoindex on;
        autoindex_format json;
        dav_methods PUT DELETE MKCOL;
        create_full_put_path on;
        add_header Cache-Control "no-cache";
        limit_except GET HEAD {
          auth_basic "spacetraders-sim";
          auth_basic_user_file /etc/nginx/publish/htpasswd;
        }
      }
    }
