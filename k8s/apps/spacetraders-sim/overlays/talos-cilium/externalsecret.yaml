# Vault path: secret/spacetraders/federation
#   FEDERATION_USERS  -- "peer:password,peer2:password2"
#
# Credentials for the dashboard's peer-federation API (:8081
# /api/federation/*), which publishes the cartographer's map to another
# agent and takes GOHERE/DONTGO advice back. The app treats an UNSET value
# as "closed" (503), never as "open", so a sync failure here degrades to a
# shut door rather than a public map.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: spacetraders-federation
  namespace: spacetraders
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: spacetraders-federation
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
  - extract:
      key: spacetraders/federation
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
