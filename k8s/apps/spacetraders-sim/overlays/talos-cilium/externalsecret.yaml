# The publisher's login for PUT/DELETE (reads are open on the LAN and proxied,
# behind UI_USERS, by spacetraders-fed at /sim/). Vault spacetraders/sim-replay
# holds one key, HTPASSWD: an htpasswd line ("user:$apr1$...").
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: spacetraders-sim-publish
  namespace: spacetraders-sim
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: spacetraders-sim-publish
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: htpasswd
    remoteRef:
      key: spacetraders/sim-replay
      property: HTPASSWD
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
