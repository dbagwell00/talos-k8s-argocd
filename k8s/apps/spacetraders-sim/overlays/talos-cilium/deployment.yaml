apiVersion: apps/v1
kind: Deployment
metadata:
  name: spacetraders-sim
  namespace: spacetraders
  labels:
    app: spacetraders-sim
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: spacetraders-sim
  template:
    metadata:
      labels:
        app: spacetraders-sim
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      # Keep the CPU-hungry sim pod off the live agent's node when possible —
      # preferred, not required, so a constrained cluster can still schedule it.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: spacetraders
      containers:
      - name: sim-lab
        image: registry.dlb.im/spacetraders-sim:latest
        imagePullPolicy: Always
        ports:
        # 8080 sim lab (Service spacetraders-sim, .143)
        # 8081 fleet dashboard (Service spacetraders-web, .142) — the agent's
        # UI moved here so it can be redeployed without restarting the agent.
        - containerPort: 8080
          name: web
        - containerPort: 8081
          name: dashboard
        env:
        # Postgres — reuse the live agent's CNPG app secret (same namespace).
        # Used for the sim_runs table AND the `live` snapshot seeder.
        - name: PG_USER
          valueFrom:
            secretKeyRef:
              name: spacetraders-pg-app
              key: username
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: spacetraders-pg-app
              key: password
        - name: DATABASE_URL
          value: "postgresql://$(PG_USER):$(PG_PASSWORD)@spacetraders-pg-rw.spacetraders.svc:5432/spacetraders"
        # Redis — the dashboard's trade-route manifest + coord-cache panels.
        # Same urlquery-encoded key the agent uses (raw contains '/' and '+').
        - name: REDIS_PASSWORD_URL
          valueFrom:
            secretKeyRef:
              name: spacetraders-redis
              key: redis-password-url
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD_URL)@spacetraders-redis-master.spacetraders.svc:6379"
        # The live agent's control API. The dashboard forwards the ~33 routes
        # that need the agent's in-memory state (limiter counters, planner.gs,
        # the scheduler) or mutate it (pause/scrap/navigate/halt/buy/config).
        # Unset would make the dashboard read-only rather than break it.
        - name: AGENT_URL
          value: "http://spacetraders.spacetraders.svc:5173"
        - name: SIM_LAB_MAX_CONCURRENT
          value: "2"
        readinessProbe:
          # The lab's own health. The dashboard shares the process, so it is
          # up whenever this is — serve.py gathers both servers and dies if
          # either does, rather than serving half the UI silently.
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          # Sims run the full planner against ~1700 ships — CPU-hungry. This pod
          # is isolated from the live agent precisely so that's safe.
          # An A/B experiment pair = 2 sim subprocesses ≈ 1 core each; observed
          # steady state ~2 cores / ~1Gi with a pair running. Requests reserve
          # that honestly so the scheduler places the pod on a node with real
          # headroom instead of packing it beside the live agent; limits leave
          # room for live-seeded pairs and a future MAX_CONCURRENT bump.
          requests:
            cpu: 2500m
            memory: 2Gi
          limits:
            cpu: "6"
            memory: 8Gi
