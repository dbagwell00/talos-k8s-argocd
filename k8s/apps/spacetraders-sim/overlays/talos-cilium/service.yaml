# Sim Lab UI on its own Cilium L2 LB IP (HTTP; sibling to spacetraders-web
# on .142). Separate from the live dashboard so the heavy sim app is isolated.
apiVersion: v1
kind: Service
metadata:
  name: spacetraders-sim
  namespace: spacetraders
  annotations:
    io.cilium/lb-ipam-ips: "192.168.4.143"
spec:
  type: LoadBalancer
  selector:
    app: spacetraders-sim
  ports:
  - name: web
    port: 80
    targetPort: 8080
    protocol: TCP
---
# The peer federation API on its own IP and its own port (:8082 in the pod).
#
# Deliberately NOT a second port on spacetraders-web: this is the one surface
# meant to be reachable from outside the LAN, and a firewall that forwards a
# port forwards everything listening behind it. Forwarding this one publishes
# three authenticated read/advice routes; forwarding .142 would publish the
# whole operational UI. See serve.py.
#
# Back to a plain LoadBalancer on .145 after the Gateway API attempt was rolled
# back. Cilium's L7 datapath does not work on this cluster: the BPF datapath
# marks the SYN for the Envoy proxy port and Envoy is bound and healthy there,
# but Envoy's listener recorded downstream_cx_total=0 -- the TPROXY handoff
# never delivers. Plain LoadBalancers are unaffected (they carry real backends
# and never enter Envoy), which is why every other service here is fine.
#
# The Certificate stays (certificate.yaml): it is issued, auto-renewing, and
# costs nothing while TLS termination is re-planned.
apiVersion: v1
kind: Service
metadata:
  name: spacetraders-fed
  namespace: spacetraders
  annotations:
    io.cilium/lb-ipam-ips: "192.168.4.145"
spec:
  type: LoadBalancer
  selector:
    app: spacetraders-sim
  ports:
  - name: federation
    port: 80
    targetPort: 8082
    protocol: TCP
