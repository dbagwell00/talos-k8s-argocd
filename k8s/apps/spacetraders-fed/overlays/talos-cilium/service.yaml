# ClusterIP: the Gateway (gateway.yaml) terminates TLS on 192.168.4.145 and
# forwards here. A LoadBalancer would republish the plaintext API.
apiVersion: v1
kind: Service
metadata:
  name: spacetraders-fed
  namespace: spacetraders-fed
spec:
  type: ClusterIP
  selector:
    app: spacetraders-fed
  ports:
  - name: federation
    port: 80
    targetPort: 8082
    protocol: TCP
