# st_fed serves what GOBBLICIDE and BLOODWATTLE publish to spacetraders_alliance
# (where our haulers work and are heading, where our probes stand) to whater,
# stores whater's GOHERE/DONTGO advice, and serves our own dashboards (overview
# at /, each agent at /<AGENT>/) behind UI_USERS. Same image as the agents.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spacetraders-fed
  namespace: spacetraders-fed
  labels:
    app: spacetraders-fed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spacetraders-fed
  template:
    metadata:
      labels:
        app: spacetraders-fed
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: fed
        image: registry.dlb.im/spacetraders-erlang:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8082
          name: federation
        env:
        - name: ST_ROLE
          value: federation
        - name: ST_FED_PORT
          value: "8082"
        - name: FEDERATION_USERS
          valueFrom:
            secretKeyRef:
              name: spacetraders-federation
              key: FEDERATION_USERS
        # Our own dashboards, behind their own login (spacetraders-erlang #316):
        # /<AGENT>/... is proxied GET-only to each agent's read-only listener.
        - name: UI_USERS
          valueFrom:
            secretKeyRef:
              name: spacetraders-federation
              key: UI_USERS
              optional: true
        - name: ST_FED_AGENTS
          value: "GOBBLICIDE=http://spacetraders-erl-web.spacetraders-erl.svc,BLOODWATTLE=http://spacetraders-bw-web.spacetraders-bw.svc"
        # The sim workers the Runners page polls (/status, token-free, read-only).
        # The coordinator's own box pushes instead (scripts/local-runner.sh).
        - name: ST_FED_RUNNERS
          value: "prox03=http://192.168.4.203:8090,prox04=http://192.168.4.204:8090,prox01=http://192.168.4.205:8090"
        - name: PG_USER
          valueFrom:
            secretKeyRef:
              name: spacetraders-fed-pg
              key: username
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: spacetraders-fed-pg
              key: password
        - name: ST_ALLY_PG_URL
          value: "postgresql://$(PG_USER):$(PG_PASSWORD)@spacetraders-pg-rw.spacetraders.svc:5432/spacetraders_alliance"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8082
          initialDelaySeconds: 3
          periodSeconds: 10
