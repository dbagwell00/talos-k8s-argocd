# Logins, "user:password,user:password", from the Vault path the retired
# spacetraders-sim server read: FEDERATION_USERS (whater, the API) and
# UI_USERS (us, the dashboards). Every key is pulled, so adding UI_USERS in
# Vault is all it takes; either one unset answers 503 for its routes.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: spacetraders-federation
  namespace: spacetraders-fed
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: spacetraders-federation
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
  - extract:
      key: spacetraders/federation
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
---
# Read access to spacetraders_alliance on the shared cluster.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: spacetraders-fed-pg
  namespace: spacetraders-fed
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: spacetraders-fed-pg
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: username
    remoteRef:
      key: spacetraders/pg
      property: username
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: password
    remoteRef:
      key: spacetraders/pg
      property: password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
