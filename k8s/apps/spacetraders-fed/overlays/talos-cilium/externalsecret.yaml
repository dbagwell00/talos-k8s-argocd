# Peer credentials, "user:password,user:password" (whater's login), the same
# Vault path the retired spacetraders-sim server read. Unset answers 503.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: spacetraders-federation
  namespace: spacetraders-fed
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: spacetraders-federation
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: FEDERATION_USERS
    remoteRef:
      key: spacetraders/federation
      property: FEDERATION_USERS
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
---
# Read access to spacetraders_alliance on the shared cluster.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: spacetraders-fed-pg
  namespace: spacetraders-fed
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: spacetraders-fed-pg
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: username
    remoteRef:
      key: spacetraders/pg
      property: username
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: password
    remoteRef:
      key: spacetraders/pg
      property: password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
