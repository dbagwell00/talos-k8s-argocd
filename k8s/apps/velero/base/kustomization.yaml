apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Static, cluster-agnostic resources. The velero Helm chart is inflated per
# overlay (not here) so each overlay untars into its own charts/ dir and the
# two overlays don't collide on a shared helm-pull target.
resources:
- namespace.yaml
- externalsecret.yaml
- minio.yaml
