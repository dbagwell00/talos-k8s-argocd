# Replaces the previously committed plaintext minio-credentials Secret.
# ESO pulls the MinIO creds from Vault (secret/velero) and renders all three
# forms the workloads need: the velero BSL `cloud` INI, and MINIO_ROOT_USER /
# MINIO_ROOT_PASSWORD env keys for the MinIO server + setup job.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: minio-credentials
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: minio-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MINIO_ROOT_USER: "{{ .access_key }}"
        MINIO_ROOT_PASSWORD: "{{ .secret_key }}"
        cloud: |
          [default]
          aws_access_key_id = {{ .access_key }}
          aws_secret_access_key = {{ .secret_key }}
  data:
  - secretKey: access_key
    remoteRef:
      key: velero
      property: access_key
  - secretKey: secret_key
    remoteRef:
      key: velero
      property: secret_key
