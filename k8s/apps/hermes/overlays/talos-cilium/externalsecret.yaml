# Vault path: secret/hermes/agent
#   TELEGRAM_BOT_TOKEN      from @BotFather
#   TELEGRAM_ALLOWED_USERS  comma-separated numeric Telegram user IDs; the
#                           gateway denies everyone else, silently
#
# The Deployment mounts this secret `optional: true`, so a missing or empty
# Vault path leaves Hermes running without Telegram instead of stuck in
# CreateContainerConfigError.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hermes-agent
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hermes-agent
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
  - extract:
      key: hermes/agent
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
