# nginx config for st-readonly: the only door Hermes has to the SpaceTraders
# agents, their logs, the public SpaceTraders API, and a fixed set of
# Prometheus queries (Proxmox/CTDB/Samba/Ceph and SpaceTraders pod health).
#
# Every route is an explicit GET-only allowlist. The agents' control APIs
# carry fleet-mutating verbs (pause, halt, buy, scrap) with no auth, so
# Hermes never talks to them directly; it talks to this, and this can only
# say the read-only paths below. Anything else is a 404, and any non-GET is
# a 405, before a byte goes upstream.
apiVersion: v1
kind: ConfigMap
metadata:
  name: st-readonly
  namespace: hermes
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 64; }

    http {
      access_log /dev/stdout;
      server_tokens off;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path       /tmp/proxy_temp;
      fastcgi_temp_path     /tmp/fastcgi_temp;
      uwsgi_temp_path       /tmp/uwsgi_temp;
      scgi_temp_path        /tmp/scgi_temp;
      client_max_body_size  1k;

      # kube-dns. Upstreams are named through variables so nginx resolves them
      # per request instead of once at startup -- a missing upstream then
      # fails that one route rather than stopping nginx from starting.
      resolver 10.96.0.10 valid=30s ipv6=off;
      resolver_timeout 5s;

      proxy_connect_timeout 5s;
      proxy_read_timeout    60s;
      proxy_http_version    1.1;
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_ssl_server_name on;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 3;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

      # Shared across every route: 2 req/s sustained, burst 10. The agents
      # spend real API budget, and the public API rate-limits by IP.
      limit_req_zone $server_name zone=all:1m rate=2r/s;
      limit_req_status 429;

      # Log query parameters, validated by shape. Anything that doesn't match
      # falls back to the default (minutes, limit) or is rejected (grep): the
      # grep token is spliced into a LogQL string, so it may hold no quote,
      # brace, pipe, backslash, space, or %-escape.
      map $arg_minutes $since {
        default 15m;
        "~^(?<m>[1-9][0-9]{0,3})$" "${m}m";
      }
      map $arg_limit $lines {
        default 100;
        "~^(?<l>[1-9][0-9]?|[1-4][0-9]{2}|500)$" $l;
      }
      map $arg_grep $grep_ok {
        default 0;
        ""      1;
        "~^[A-Za-z0-9._:-]{0,64}$" 1;
      }
      # LogQL stream selectors, pre-encoded. Fixed per agent: the caller picks
      # erl or py and never writes a selector, so no other namespace's logs
      # are reachable through here.
      map $log_agent $log_selector {
        erl "%7Bnamespace%3D%22spacetraders-erl%22%2Capp%3D%22spacetraders-erl%22%7D";
        py  "%7Bnamespace%3D%22spacetraders%22%2Capp%3D%22spacetraders%22%7D";
      }

      # Prometheus: a fixed menu of instant queries, by name. The caller
      # never writes PromQL. Pre-encoded so nothing it sends reaches the query.
      map $prom_name $prom_query {
        default "";
        homelab                  "%7B__name__%3D~%22homelab_.%2A%22%7D";
        host_up                  "up%7Bjob%3D%22proxmox-node-exporter%22%7D";
        rootfs_free              "node_filesystem_avail_bytes%7Bjob%3D%22proxmox-node-exporter%22%2Cmountpoint%3D%22%2F%22%7D%20%2F%20node_filesystem_size_bytes%7Bjob%3D%22proxmox-node-exporter%22%2Cmountpoint%3D%22%2F%22%7D";
        ctdb_gen_changes_1h      "changes%28homelab_ctdb_generation%5B1h%5D%29";
        ctdb_recoveries_max_15m  "max_over_time%28homelab_ctdb_recoveries_5m%5B15m%5D%29";
        samba_cores_max_1h       "max_over_time%28homelab_samba_core_files_5m%5B1h%5D%29";
        st_deploy_spec           "kube_deployment_spec_replicas%7Bnamespace%3D~%22spacetraders%7Cspacetraders-erl%22%2Cdeployment%3D~%22spacetraders%7Cspacetraders-erl%22%7D";
        st_deploy_avail          "kube_deployment_status_replicas_available%7Bnamespace%3D~%22spacetraders%7Cspacetraders-erl%22%2Cdeployment%3D~%22spacetraders%7Cspacetraders-erl%22%7D";
        st_pods_ready            "kube_pod_status_ready%7Bnamespace%3D%22spacetraders%22%2Ccondition%3D%22true%22%2Cpod%3D~%22spacetraders-pg-.%2A%7Cspacetraders-redis-master-.%2A%22%7D";
        st_restarts_1h           "increase%28kube_pod_container_status_restarts_total%7Bnamespace%3D~%22spacetraders%7Cspacetraders-erl%22%7D%5B1h%5D%29%20%3E%200";
        st_pvc_used              "kubelet_volume_stats_used_bytes%7Bnamespace%3D~%22spacetraders%7Cspacetraders-erl%22%7D%20%2F%20kubelet_volume_stats_capacity_bytes%7Bnamespace%3D~%22spacetraders%7Cspacetraders-erl%22%7D";
        bi_camera_age            "time%28%29%20-%20max%20by%20%28camera%29%20%28max_over_time%28homelab_blueiris_camera_last_write_seconds%5B7d%5D%29%29";
        bi_bitrate               "max%20by%20%28camera%29%20%28rate%28homelab_blueiris_camera_segment_bytes%5B10m%5D%29%29";
      }

      server {
        listen 8080;
        default_type application/json;

        if ($request_method != GET) { return 405 '{"error":"GET only"}\n'; }
        limit_req zone=all burst=10 nodelay;

        location = /healthz { return 200 '{"ok":true}\n'; }

        # Erlang agent: its 8080 listener is itself GET-only.
        location ~ "^/erl/live/(?<erl_ep>[a-z_]{1,32})$" {
          set $ep $erl_ep;
          set $up spacetraders-erl-web.spacetraders-erl.svc.cluster.local;
          proxy_pass http://$up/live/$ep;
        }

        # Python agent: 5173 mixes reads with POST verbs; only these GETs.
        location ~ ^/py/(?<py_ep>healthz|api/(chart|limiter|coverage|expansion|config|market-freshness|mining/groups|probe-circuits|fleet/competitors|fleet/halts|fleet/system-targets))$ {
          set $ep $py_ep;
          set $up spacetraders-control.spacetraders.svc.cluster.local;
          proxy_pass http://$up:5173/$ep;
        }

        # Loki, pinned to one agent's stream.
        location ~ ^/logs/(?<agent_name>erl|py)$ {
          set $log_agent $agent_name;
          if ($grep_ok = 0) { return 400 '{"error":"grep: 0-64 chars of [A-Za-z0-9._:-]"}\n'; }
          set $up loki.monitoring.svc.cluster.local;
          proxy_pass http://$up:3100/loki/api/v1/query_range?query=$log_selector%20%7C%3D%20%22$arg_grep%22&since=$since&limit=$lines&direction=backward;
        }

        # Public SpaceTraders API (no token is ever sent).
        location = /st/leaderboard {
          set $up api.spacetraders.io;
          proxy_set_header Host api.spacetraders.io;
          proxy_ssl_name api.spacetraders.io;
          proxy_pass https://$up/v2/;
        }
        location ~ "^/st/agents/(?<st_sym>[A-Za-z0-9_-]{1,32})$" {
          set $sym $st_sym;
          set $up api.spacetraders.io;
          proxy_set_header Host api.spacetraders.io;
          proxy_ssl_name api.spacetraders.io;
          proxy_pass https://$up/v2/agents/$sym;
        }

        # Prometheus, fixed queries only (see the map above).
        location ~ "^/prom/(?<pq>[a-z0-9_]{1,40})$" {
          set $prom_name $pq;
          if ($prom_query = "") { return 404 '{"error":"unknown query"}\n'; }
          set $up prom-prometheus.monitoring.svc.cluster.local;
          proxy_pass http://$up:9090/api/v1/query?query=$prom_query;
        }

        location / { return 404 '{"error":"not on the allowlist"}\n'; }
      }
    }
