# nginx config for st-readonly: the only door Hermes has to the SpaceTraders
# agents, their logs, and the public SpaceTraders API.
#
# Every route is an explicit GET-only allowlist. The agents' control APIs
# carry fleet-mutating verbs (pause, halt, buy, scrap) with no auth, so
# Hermes never talks to them directly; it talks to this, and this can only
# say the read-only paths below. Anything else is a 404, and any non-GET is
# a 405, before a byte goes upstream.
apiVersion: v1
kind: ConfigMap
metadata:
  name: st-readonly
  namespace: hermes
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 64; }

    http {
      access_log /dev/stdout;
      server_tokens off;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path       /tmp/proxy_temp;
      fastcgi_temp_path     /tmp/fastcgi_temp;
      uwsgi_temp_path       /tmp/uwsgi_temp;
      scgi_temp_path        /tmp/scgi_temp;
      client_max_body_size  1k;

      # kube-dns. Upstreams are named through variables so nginx resolves them
      # per request instead of once at startup -- a missing upstream then
      # fails that one route rather than stopping nginx from starting.
      resolver 10.96.0.10 valid=30s ipv6=off;
      resolver_timeout 5s;

      proxy_connect_timeout 5s;
      proxy_read_timeout    60s;
      proxy_http_version    1.1;
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_ssl_server_name on;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 3;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

      # Shared across every route: 2 req/s sustained, burst 10. The agents
      # spend real API budget, and the public API rate-limits by IP.
      limit_req_zone $server_name zone=all:1m rate=2r/s;
      limit_req_status 429;

      # Log query parameters, validated by shape. Anything that doesn't match
      # falls back to the default (minutes, limit) or is rejected (grep): the
      # grep token is spliced into a LogQL string, so it may hold no quote,
      # brace, pipe, backslash, space, or %-escape.
      map $arg_minutes $since {
        default 15m;
        "~^(?<m>[1-9][0-9]{0,3})$" "${m}m";
      }
      map $arg_limit $lines {
        default 100;
        "~^(?<l>[1-9][0-9]?|[1-4][0-9]{2}|500)$" $l;
      }
      map $arg_grep $grep_ok {
        default 0;
        ""      1;
        "~^[A-Za-z0-9._:-]{0,64}$" 1;
      }
      # LogQL stream selectors, pre-encoded. Fixed per agent: the caller picks
      # erl or py and never writes a selector, so no other namespace's logs
      # are reachable through here.
      map $log_agent $log_selector {
        erl "%7Bnamespace%3D%22spacetraders-erl%22%2Capp%3D%22spacetraders-erl%22%7D";
        py  "%7Bnamespace%3D%22spacetraders%22%2Capp%3D%22spacetraders%22%7D";
      }

      server {
        listen 8080;
        default_type application/json;

        if ($request_method != GET) { return 405 '{"error":"GET only"}\n'; }
        limit_req zone=all burst=10 nodelay;

        location = /healthz { return 200 '{"ok":true}\n'; }

        # Erlang agent: its 8080 listener is itself GET-only.
        location ~ "^/erl/live/(?<erl_ep>[a-z_]{1,32})$" {
          set $ep $erl_ep;
          set $up spacetraders-erl-web.spacetraders-erl.svc.cluster.local;
          proxy_pass http://$up/live/$ep;
        }

        # Python agent: 5173 mixes reads with POST verbs; only these GETs.
        location ~ ^/py/(?<py_ep>healthz|api/(chart|limiter|coverage|expansion|config|market-freshness|mining/groups|probe-circuits|fleet/competitors|fleet/halts|fleet/system-targets))$ {
          set $ep $py_ep;
          set $up spacetraders-control.spacetraders.svc.cluster.local;
          proxy_pass http://$up:5173/$ep;
        }

        # Loki, pinned to one agent's stream.
        location ~ ^/logs/(?<agent_name>erl|py)$ {
          set $log_agent $agent_name;
          if ($grep_ok = 0) { return 400 '{"error":"grep: 0-64 chars of [A-Za-z0-9._:-]"}\n'; }
          set $up loki.monitoring.svc.cluster.local;
          proxy_pass http://$up:3100/loki/api/v1/query_range?query=$log_selector%20%7C%3D%20%22$arg_grep%22&since=$since&limit=$lines&direction=backward;
        }

        # Public SpaceTraders API (no token is ever sent).
        location = /st/leaderboard {
          set $up api.spacetraders.io;
          proxy_set_header Host api.spacetraders.io;
          proxy_ssl_name api.spacetraders.io;
          proxy_pass https://$up/v2/;
        }
        location ~ "^/st/agents/(?<st_sym>[A-Za-z0-9_-]{1,32})$" {
          set $sym $st_sym;
          set $up api.spacetraders.io;
          proxy_set_header Host api.spacetraders.io;
          proxy_ssl_name api.spacetraders.io;
          proxy_pass https://$up/v2/agents/$sym;
        }

        location / { return 404 '{"error":"not on the allowlist"}\n'; }
      }
    }
