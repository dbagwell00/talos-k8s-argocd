# Replaces the previously committed plaintext bitwarden secrets.
# Both pull from Vault secret/bitwarden (15 keys incl. the SQL connection string).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bitwarden-secret
  namespace: bitwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: bitwarden-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
  - extract:
      key: bitwarden
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bitwarden-sql-connection-string
  namespace: bitwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: bitwarden-sql-connection-string
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: globalSettings__sqlServer__connectionString
    remoteRef:
      key: bitwarden
      property: globalSettings__sqlServer__connectionString
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
