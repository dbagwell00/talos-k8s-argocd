# Replaces the out-of-band nordvpn-creds secret. ESO pulls the WireGuard
# private key from Vault (secret/nordvpn) into the secret gluetun consumes.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nordvpn-creds
  namespace: vpn-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: nordvpn-creds
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: private-key
    remoteRef:
      key: nordvpn
      property: private-key
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
