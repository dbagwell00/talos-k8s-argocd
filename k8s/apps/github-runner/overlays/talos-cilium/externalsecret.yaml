# Vault path: secret/github-runner
#   GITHUB_TOKEN: PAT for runner registration (scope: repo)
#   REPO_URL:     https://github.com/dbagwell00/spacetraders
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-runner
  namespace: github-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: github-runner-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
  - extract:
      key: github-runner
