apiVersion: apps/v1
kind: Deployment
metadata:
  name: spacetraders
  namespace: spacetraders
  labels:
    app: spacetraders
spec:
  replicas: 1
  # Single-writer: planner assumes one instance. Recreate avoids two pods
  # racing on the API + DB during rollouts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: spacetraders
  template:
    metadata:
      labels:
        app: spacetraders
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: hub
        image: registry.dlb.im/spacetraders:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5173
          name: web
        env:
        # Agent identity (from Vault via ExternalSecret)
        - name: ACCOUNT_TOKEN
          valueFrom:
            secretKeyRef:
              name: spacetraders-agent
              key: ACCOUNT_TOKEN
        - name: AGENT_TOKEN
          valueFrom:
            secretKeyRef:
              name: spacetraders-agent
              key: AGENT_TOKEN
        - name: AGENT_SYMBOL
          valueFrom:
            secretKeyRef:
              name: spacetraders-agent
              key: AGENT_SYMBOL
        # ST_RESET_ID intentionally removed: the agent resolves the current
        # reset from the token/server at boot (set_current_reset_id) — the
        # secret went stale and mis-tagged a whole reset's universe.
        # Postgres — compose URI from CNPG app secret
        - name: PG_USER
          valueFrom:
            secretKeyRef:
              name: spacetraders-pg-app
              key: username
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: spacetraders-pg-app
              key: password
        - name: DATABASE_URL
          value: "postgresql://$(PG_USER):$(PG_PASSWORD)@spacetraders-pg-rw.spacetraders.svc:5432/spacetraders"
        # Redis — use the urlquery-encoded password key (raw contains '/' + '+')
        - name: REDIS_PASSWORD_URL
          valueFrom:
            secretKeyRef:
              name: spacetraders-redis
              key: redis-password-url
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD_URL)@spacetraders-redis-master.spacetraders.svc:6379"
        # Tuning
        - name: WORKER_POOL_SIZE
          value: "32"
        # CPU is deliberately REQUEST-ONLY: no `limits.cpu`, so the container
        # is never cgroup-throttled and may burst across every core the node
        # can spare. Verified in-pod: `cpu.max` reads "max 100000" (no quota)
        # and `Cpus_allowed_list` is 0-3.
        #
        # The request went 1000m -> 2000m on 2026-08-23. Read the honest
        # caveat before expecting throughput from it: the hub sat at exactly
        # 1000m — one core, pinned — while the node ran 31% idle and the
        # container was already uncapped. That ceiling is CPython's, not the
        # scheduler's: asyncio drives the planner on a single thread, so the
        # loop cannot consume a second core no matter what it is granted.
        # A larger request buys a guaranteed share under contention and costs
        # nothing here; it does not buy parallelism. Making the planner use
        # the other cores is a code change (less work per tick, or planning in
        # its own process), not a manifest change.
        #
        # Ceiling: node allocatable is 3950m against 2600m already requested,
        # so anything above ~2350m makes this pod unschedulable.
        resources:
          requests:
            cpu: 2000m
            memory: 512Mi
          limits:
            memory: 2Gi
