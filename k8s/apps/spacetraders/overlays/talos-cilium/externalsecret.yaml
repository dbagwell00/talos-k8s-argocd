# Vault path: secret/spacetraders/agent
#   ACCOUNT_TOKEN, AGENT_TOKEN, AGENT_SYMBOL, ST_RESET_ID
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: spacetraders-agent
  namespace: spacetraders
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: spacetraders-agent
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
  - extract:
      key: spacetraders/agent
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
