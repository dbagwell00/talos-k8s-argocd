# Ingress to the web dashboard (LB SNATs to pod CIDR = world).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-spacetraders-web
  namespace: spacetraders
spec:
  endpointSelector:
    matchLabels:
      app: spacetraders
  ingress:
  - fromEntities:
    - world
    - cluster
    toPorts:
    - ports:
      - port: "5173"
        protocol: TCP
# NOTE: deliberately NO egress policy on the spacetraders pod.
# Initial draft (kube-dns + in-ns + ToFQDNs api.spacetraders.io) silently
# broke DNS resolution for asyncpg. Re-add later with full DNS visibility +
# verified Cilium endpoint selectors; egress default-deny on this pod is a
# nice-to-have, not a must-have.
