# Ingress to the web dashboard (LB SNATs to pod CIDR = world).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-spacetraders-web
  namespace: spacetraders
spec:
  endpointSelector:
    matchLabels:
      app: spacetraders
  ingress:
  - fromEntities:
    - world
    - cluster
    toPorts:
    - ports:
      - port: "5173"
        protocol: TCP
---
# App egress: DNS (with visibility for ToFQDNs), in-namespace (PG/Redis),
# and api.spacetraders.io on the internet.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-spacetraders-egress
  namespace: spacetraders
spec:
  endpointSelector:
    matchLabels:
      app: spacetraders
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: ANY
      rules:
        dns:
        - matchPattern: "*"
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: spacetraders
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
      - port: "6379"
        protocol: TCP
  - toFQDNs:
    - matchName: "api.spacetraders.io"
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
---
# Allow ingress to Postgres (CNPG) from app pods.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-spacetraders-pg
  namespace: spacetraders
spec:
  endpointSelector:
    matchExpressions:
    - key: cnpg.io/cluster
      operator: Exists
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: spacetraders
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
---
# Allow ingress to Redis from app pods.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-spacetraders-redis
  namespace: spacetraders
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: spacetraders
    toPorts:
    - ports:
      - port: "6379"
        protocol: TCP
