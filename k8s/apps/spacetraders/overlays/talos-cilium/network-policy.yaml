# Ingress to the agent's control API on 5173.
#
# This used to be the dashboard's port. The dashboard moved to the
# spacetraders-sim pod, which now calls 5173 from inside the cluster — covered
# by `cluster` below. `world` stays because the port is still reachable from
# the LAN for ad-hoc curls and because the LB SNATs to the pod CIDR, which
# Cilium classifies as world; narrowing it is a separate change with its own
# blast radius.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-spacetraders-web
  namespace: spacetraders
spec:
  endpointSelector:
    matchLabels:
      app: spacetraders
  ingress:
  - fromEntities:
    - world
    - cluster
    toPorts:
    - ports:
      - port: "5173"
        protocol: TCP
# NOTE: deliberately NO egress policy on the spacetraders pod.
# Initial draft (kube-dns + in-ns + ToFQDNs api.spacetraders.io) silently
# broke DNS resolution for asyncpg. Re-add later with full DNS visibility +
# verified Cilium endpoint selectors; egress default-deny on this pod is a
# nice-to-have, not a must-have.
