apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      # Cross-cluster: reach the central Vault on talos-mesh over its
      # public-TLS Gateway endpoint (Let's Encrypt cert, no caBundle needed).
      server: "https://vault.dlb.im"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          # Separate Vault auth mount for the talos-cilium cluster
          mountPath: "kubernetes-cilium"
          role: "external-secrets"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
