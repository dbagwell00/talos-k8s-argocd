# Identity used by the central Vault (on talos-mesh) to validate talos-cilium
# ServiceAccount tokens via the TokenReview API (Vault auth mount: kubernetes-cilium).
# The long-lived reviewer token Secret is created by scripts/bootstrap-vault.sh
# (its value is generated by Kubernetes and never committed).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-token-reviewer
  namespace: external-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-token-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: vault-token-reviewer
  namespace: external-secrets
