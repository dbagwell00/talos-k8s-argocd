# Replaces the previously committed plaintext cloudflare-secret.yaml.
# ESO pulls the Cloudflare API token from Vault (secret/cloudflare) into the
# secret the letsencrypt-cloudflare ClusterIssuer references for DNS-01.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: api-token
    remoteRef:
      key: cloudflare
      property: api-token
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
