# Twin of the talos-mesh ClusterIssuer, deliberately duplicated rather than
# shared: ClusterIssuers are cluster-scoped, so each cluster registers its own
# ACME account (its own `letsencrypt-cloudflare` private key). Both solve DNS-01
# against the same Cloudflare zone, which is why neither cluster needs to be
# reachable from the internet for issuance.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-cloudflare
spec:
  acme:
    email: dustin@dlb.im
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-cloudflare
    solvers:
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            key: api-token
            name: cloudflare-api-token
