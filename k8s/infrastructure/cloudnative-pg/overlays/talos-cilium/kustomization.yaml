apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cnpg-system

helmCharts:
- name: cloudnative-pg
  repo: https://cloudnative-pg.github.io/charts
  version: 0.22.1
  releaseName: cnpg
  namespace: cnpg-system
  includeCRDs: true
  valuesInline:
    # talos-cilium is all control-plane — tolerate the taint
    tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

resources:
- namespace.yaml
