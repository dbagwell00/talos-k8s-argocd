apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: vault-gateway
  namespace: vault
  annotations:
    io.cilium/lb-ipam-ips: "192.168.6.131"
spec:
  gatewayClassName: cilium
  listeners:
  - name: http
    protocol: HTTP
    port: 80
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: vault-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault-http-redirect
  namespace: vault
spec:
  parentRefs:
  - name: vault-gateway
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault-route
  namespace: vault
spec:
  parentRefs:
  - name: vault-gateway
    sectionName: https
  hostnames:
  - vault.dlb.im
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    # vault-active routes only to the current Raft leader (avoids standby redirects)
    - name: vault-active
      port: 8200
