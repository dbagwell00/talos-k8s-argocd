apiVersion: apps/v1
kind: Deployment
metadata:
  name: csi-rbdplugin-provisioner
  namespace: kube-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: csi-rbdplugin-provisioner
  template:
    metadata:
      labels:
        app: csi-rbdplugin-provisioner
    spec:
      serviceAccountName: rbd-csi-provisioner
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
      containers:
      - name: csi-provisioner
        image: registry.k8s.io/sig-storage/csi-provisioner:v4.0.0
        args:
        - --csi-address=$(ADDRESS)
        - --v=2
        - --timeout=150s
        - --leader-election=true
        env:
        - name: ADDRESS
          value: /csi/csi-provisioner.sock
        volumeMounts:
        - name: socket-dir
          mountPath: /csi
      - name: csi-attacher
        image: registry.k8s.io/sig-storage/csi-attacher:v4.5.0
        args:
        - --v=2
        - --csi-address=$(ADDRESS)
        - --leader-election=true
        env:
        - name: ADDRESS
          value: /csi/csi-provisioner.sock
        volumeMounts:
        - name: socket-dir
          mountPath: /csi
      - name: csi-snapshotter
        image: registry.k8s.io/sig-storage/csi-snapshotter:v8.2.0
        args:
        - --csi-address=$(ADDRESS)
        - --v=2
        - --leader-election=true
        env:
        - name: ADDRESS
          value: /csi/csi-provisioner.sock
        volumeMounts:
        - name: socket-dir
          mountPath: /csi
      - name: csi-rbdplugin
        image: quay.io/cephcsi/cephcsi:v3.16.0
        args:
        - --nodeid=$(NODE_ID)
        - --type=rbd
        - --drivername=rbd.csi.ceph.com
        - --controllerserver=true
        - --endpoint=$(CSI_ENDPOINT)
        - --v=2
        env:
        - name: NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: CSI_ENDPOINT
          value: unix:///csi/csi-provisioner.sock
        volumeMounts:
        - name: socket-dir
          mountPath: /csi
        - name: ceph-csi-config
          mountPath: /etc/ceph-csi-config/
        - name: keys-tmp-dir
          mountPath: /tmp/csi/keys
      volumes:
      - name: socket-dir
        emptyDir:
          medium: Memory
      - name: ceph-csi-config
        configMap:
          name: ceph-csi-config
      - name: keys-tmp-dir
        emptyDir:
          medium: Memory
