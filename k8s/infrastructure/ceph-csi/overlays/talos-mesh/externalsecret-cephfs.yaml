# Replaces the out-of-band csi-cephfs-secret (Ceph CephFS CSI creds) from Vault secret/ceph-cephfs.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: csi-cephfs-secret
  namespace: kube-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: csi-cephfs-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: adminID
    remoteRef: { key: ceph-cephfs, property: adminID, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
  - secretKey: adminKey
    remoteRef: { key: ceph-cephfs, property: adminKey, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
  - secretKey: userID
    remoteRef: { key: ceph-cephfs, property: userID, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
  - secretKey: userKey
    remoteRef: { key: ceph-cephfs, property: userKey, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
