# Replaces the out-of-band csi-rbd-secret (Ceph RBD CSI creds) from Vault secret/ceph-rbd.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: csi-rbd-secret
  namespace: kube-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: csi-rbd-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: userID
    remoteRef: { key: ceph-rbd, property: userID, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
  - secretKey: userKey
    remoteRef: { key: ceph-rbd, property: userKey, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
