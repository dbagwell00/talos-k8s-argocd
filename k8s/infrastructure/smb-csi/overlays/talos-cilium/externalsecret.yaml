# Replaces the out-of-band samba-creds secret (media ns) consumed by the SMB
# PVs (smb-media here, and filebrowser's smb-mnt). Sourced from Vault secret/samba.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: samba-creds
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: samba-creds
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: username
    remoteRef:
      key: samba
      property: username
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: password
    remoteRef:
      key: samba
      property: password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
