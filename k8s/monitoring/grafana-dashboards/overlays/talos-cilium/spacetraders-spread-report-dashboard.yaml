apiVersion: v1
kind: ConfigMap
metadata:
  name: spacetraders-spread-report-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "SpaceTraders"
data:
  spacetraders-spread-report.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "refresh": "1m",
      "schemaVersion": 39,
      "tags": ["spacetraders", "spread", "expansion"],
      "time": { "from": "now-6h", "to": "now" },
      "timezone": "browser",
      "title": "SpaceTraders — Expansion / Spread Report",
      "uid": "spacetraders-spread-report",
      "version": 1,
      "templating": { "list": [] },
      "panels": [
        {
          "type": "row", "title": "Fleet & Territory (latest snapshot)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }, "id": 100, "collapsed": false, "panels": []
        },
        {
          "type": "stat", "title": "Traders", "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 }, "id": 1,
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none" },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT sum(traders)::float AS traders FROM spread_snapshot WHERE ts=(SELECT max(ts) FROM spread_snapshot)" } ]
        },
        {
          "type": "stat", "title": "Probes", "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 }, "id": 2,
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none" },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT sum(probes)::float AS probes FROM spread_snapshot WHERE ts=(SELECT max(ts) FROM spread_snapshot)" } ]
        },
        {
          "type": "stat", "title": "Territory systems", "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 }, "id": 3,
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none" },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT count(*)::float AS systems FROM spread_snapshot WHERE ts=(SELECT max(ts) FROM spread_snapshot)" } ]
        },
        {
          "type": "stat", "title": "Occupied / Frontier / Next wave", "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 }, "id": 4,
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": true }, "colorMode": "value", "graphMode": "none", "textMode": "value_and_name" },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT count(*) FILTER (WHERE hops_from_occupied=0)::float AS occupied, count(*) FILTER (WHERE hops_from_occupied=1)::float AS frontier, count(*) FILTER (WHERE hops_from_occupied=2)::float AS next_wave FROM spread_snapshot WHERE ts=(SELECT max(ts) FROM spread_snapshot)" } ]
        },
        {
          "type": "stat", "title": "Total trader deficit", "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 }, "id": 5,
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 20 }, { "color": "red", "value": 100 } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "background", "graphMode": "none" },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT sum(greatest(trader_target-traders,0))::float AS deficit FROM spread_snapshot WHERE ts=(SELECT max(ts) FROM spread_snapshot)" } ]
        },
        {
          "type": "row", "title": "Market freshness (live)", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 }, "id": 101, "collapsed": false, "panels": []
        },
        {
          "type": "stat", "title": "Fresh <10m", "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 4, "w": 8, "x": 0, "y": 6 }, "id": 6,
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none" },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT count(*)::float AS fresh FROM markets WHERE extract(epoch from now())-updated_at < 600" } ]
        },
        {
          "type": "stat", "title": "Stale 10-60m", "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 4, "w": 8, "x": 8, "y": 6 }, "id": 7,
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "yellow", "value": null } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none" },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT count(*)::float AS stale FROM markets WHERE extract(epoch from now())-updated_at BETWEEN 600 AND 3600" } ]
        },
        {
          "type": "stat", "title": "Very stale >60m", "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 6 }, "id": 8,
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none" },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT count(*)::float AS very_stale FROM markets WHERE extract(epoch from now())-updated_at > 3600" } ]
        },
        {
          "type": "row", "title": "Trader Deficits — where to send/buy haulers", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 10 }, "id": 102, "collapsed": false, "panels": []
        },
        {
          "type": "table", "title": "Trader Deficit Candidates (traders < target, by deficit then score)", "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 11, "w": 12, "x": 0, "y": 11 }, "id": 9,
          "fieldConfig": { "defaults": { "custom": { "align": "auto" } }, "overrides": [ { "matcher": { "id": "byName", "options": "deficit" }, "properties": [ { "id": "custom.cellOptions", "value": { "type": "color-background" } }, { "id": "thresholds", "value": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 3 } ] } } ] } ] },
          "options": { "showHeader": true, "sortBy": [ { "displayName": "deficit", "desc": true } ] },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT system, trader_target-traders AS deficit, traders||'/'||trader_target AS t_p, round(score) AS score, markets, tag, hops_from_occupied AS hops FROM spread_snapshot WHERE ts=(SELECT max(ts) FROM spread_snapshot) AND traders < trader_target ORDER BY deficit DESC, score DESC LIMIT 40" } ]
        },
        {
          "type": "table", "title": "Probe Surplus Candidates (probes > target, by surplus)", "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 11, "w": 12, "x": 12, "y": 11 }, "id": 10,
          "fieldConfig": { "defaults": { "custom": { "align": "auto" } }, "overrides": [ { "matcher": { "id": "byName", "options": "surplus" }, "properties": [ { "id": "custom.cellOptions", "value": { "type": "color-background" } }, { "id": "thresholds", "value": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 5 }, { "color": "red", "value": 20 } ] } } ] } ] },
          "options": { "showHeader": true, "sortBy": [ { "displayName": "surplus", "desc": true } ] },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT system, probes-probe_target AS surplus, probes||'/'||probe_target AS p_target, round(score) AS score, markets, tag FROM spread_snapshot WHERE ts=(SELECT max(ts) FROM spread_snapshot) AND probes > probe_target ORDER BY surplus DESC LIMIT 40" } ]
        },
        {
          "type": "row", "title": "Frontier & Next Wave — where to expand", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 22 }, "id": 103, "collapsed": false, "panels": []
        },
        {
          "type": "table", "title": "Frontier Systems (1 hop out, by score)", "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 11, "w": 12, "x": 0, "y": 23 }, "id": 11,
          "fieldConfig": { "defaults": { "custom": { "align": "auto" } }, "overrides": [] },
          "options": { "showHeader": true, "sortBy": [ { "displayName": "score", "desc": true } ] },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT system, traders||'/'||trader_target AS t, probes||'/'||probe_target AS p, round(score) AS score, markets, has_shipyard AS yard, uncharted, tag FROM spread_snapshot WHERE ts=(SELECT max(ts) FROM spread_snapshot) AND hops_from_occupied=1 ORDER BY score DESC LIMIT 40" } ]
        },
        {
          "type": "table", "title": "Next Wave (2 hops out, by score)", "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 11, "w": 12, "x": 12, "y": 23 }, "id": 12,
          "fieldConfig": { "defaults": { "custom": { "align": "auto" } }, "overrides": [] },
          "options": { "showHeader": true, "sortBy": [ { "displayName": "score", "desc": true } ] },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT system, round(score) AS score, markets, has_shipyard AS yard, uncharted, tag FROM spread_snapshot WHERE ts=(SELECT max(ts) FROM spread_snapshot) AND hops_from_occupied=2 ORDER BY score DESC LIMIT 40" } ]
        }
      ]
    }
