apiVersion: v1
kind: ConfigMap
metadata:
  name: spacetraders-pull-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "SpaceTraders"
data:
  spacetraders-pull.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["spacetraders", "pull-model"],
      "time": { "from": "now-6h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "SpaceTraders — Pull Model (Probe Parking & API)",
      "uid": "spacetraders-pull",
      "version": 1,
      "templating": { "list": [] },
      "panels": [
        {
          "type": "row",
          "title": "API Budget — Pull-Model Reallocation (baseline before change: 79% roaming, 1.8% revenue)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "collapsed": false,
          "panels": []
        },
        {
          "type": "stat",
          "title": "Request rate (req/s)",
          "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "id": 1,
          "fieldConfig": { "defaults": { "unit": "reqps", "decimals": 2, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 1.5 }, { "color": "red", "value": 1.9 } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none", "textMode": "auto" },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT count(*)::float / NULLIF(max(ts) - min(ts), 0) AS rps FROM api_requests WHERE $__unixEpochFilter(ts)" } ]
        },
        {
          "type": "stat",
          "title": "% of 2 req/s ceiling",
          "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "id": 2,
          "fieldConfig": { "defaults": { "unit": "percent", "decimals": 0, "min": 0, "max": 100, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 80 }, { "color": "red", "value": 95 } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "background", "graphMode": "none", "textMode": "auto" },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT 100.0 * count(*) / NULLIF(max(ts) - min(ts), 0) / 2.0 AS pct FROM api_requests WHERE $__unixEpochFilter(ts)" } ]
        },
        {
          "type": "stat",
          "title": "Revenue share of budget (buy/sell) — was 1.8%",
          "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 },
          "id": 3,
          "fieldConfig": { "defaults": { "unit": "percent", "decimals": 1, "min": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "yellow", "value": 3 }, { "color": "green", "value": 5 } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "background", "graphMode": "none", "textMode": "auto" },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT 100.0 * count(*) FILTER (WHERE endpoint ~ '/(sell|purchase)$') / NULLIF(count(*), 0) AS pct FROM api_requests WHERE $__unixEpochFilter(ts)" } ]
        },
        {
          "type": "stat",
          "title": "Movement share (nav/orbit/dock) — was ~53%",
          "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 1 },
          "id": 4,
          "fieldConfig": { "defaults": { "unit": "percent", "decimals": 1, "min": 0, "max": 100, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 35 }, { "color": "red", "value": 50 } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "background", "graphMode": "none", "textMode": "auto" },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT 100.0 * count(*) FILTER (WHERE endpoint ~ '/(navigate|orbit|dock)$') / NULLIF(count(*), 0) AS pct FROM api_requests WHERE $__unixEpochFilter(ts)" } ]
        },
        {
          "type": "stat",
          "title": "Roaming share (circuit scans) — was 79%, target 0",
          "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 1 },
          "id": 5,
          "fieldConfig": { "defaults": { "unit": "percent", "decimals": 1, "min": 0, "max": 100, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 5 }, { "color": "red", "value": 25 } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "background", "graphMode": "none", "textMode": "auto" },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT 100.0 * count(*) FILTER (WHERE order_label ~ '^circuit') / NULLIF(count(*), 0) AS pct FROM api_requests WHERE $__unixEpochFilter(ts)" } ]
        },
        {
          "type": "stat",
          "title": "Trades / hour (buy+sell) — was ~125",
          "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 1 },
          "id": 6,
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "yellow", "value": 150 }, { "color": "green", "value": 300 } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none", "textMode": "auto" },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT count(*) FILTER (WHERE endpoint ~ '/(sell|purchase)$')::float * 3600 / NULLIF(max(ts) - min(ts), 0) AS tph FROM api_requests WHERE $__unixEpochFilter(ts)" } ]
        },
        {
          "type": "timeseries",
          "title": "API calls/min by category — the push→pull inversion (movement collapses, revenue climbs)",
          "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 5 },
          "id": 7,
          "fieldConfig": { "defaults": { "unit": "cpm", "custom": { "drawStyle": "line", "fillOpacity": 40, "lineWidth": 1, "showPoints": "never", "stacking": { "mode": "normal", "group": "A" } } }, "overrides": [] },
          "options": { "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "time_series", "rawQuery": true, "rawSql": "SELECT to_timestamp(floor(ts/60)*60) AS time, CASE WHEN endpoint ~ '/(navigate|orbit|dock)$' THEN 'movement (nav/orbit/dock)' WHEN endpoint ~ '/market$' THEN 'market scan' WHEN endpoint ~ '/(sell|purchase)$' THEN 'revenue (buy/sell)' WHEN endpoint ~ '/scan/ships$' THEN 'scan_ships' WHEN endpoint ~ '/jump$' THEN 'jump' WHEN endpoint ~ '/refuel$' THEN 'refuel' WHEN endpoint ~ '/my/ships/[^/]+$' THEN 'ship poll' ELSE 'other' END AS category, count(*)::float AS cpm FROM api_requests WHERE $__unixEpochFilter(ts) GROUP BY 1, 2 ORDER BY 1" } ]
        },
        {
          "type": "row",
          "title": "Trade Throughput",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "id": 101,
          "collapsed": false,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Trades / min (buys + sells)",
          "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 15 },
          "id": 8,
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "drawStyle": "line", "fillOpacity": 20, "lineWidth": 2, "showPoints": "never" } }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "calcs": ["mean"] }, "tooltip": { "mode": "multi" } },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "time_series", "rawQuery": true, "rawSql": "SELECT to_timestamp(floor(ts/60)*60) AS time, CASE WHEN endpoint ~ '/sell$' THEN 'sells' ELSE 'buys' END AS kind, count(*)::float AS n FROM api_requests WHERE $__unixEpochFilter(ts) AND endpoint ~ '/(sell|purchase)$' GROUP BY 1, 2 ORDER BY 1" } ]
        },
        {
          "type": "timeseries",
          "title": "Credits over time",
          "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 15 },
          "id": 9,
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" } }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "single" } },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "time_series", "rawQuery": true, "rawSql": "SELECT to_timestamp(floor(ts/300)*300) AS time, max(credits) AS credits FROM credits_history WHERE $__unixEpochFilter(ts) GROUP BY 1 ORDER BY 1" } ]
        },
        {
          "type": "row",
          "title": "Probe Parking (current state)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 23 },
          "id": 102,
          "collapsed": false,
          "panels": []
        },
        {
          "type": "stat",
          "title": "% probes parked at a market",
          "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 24 },
          "id": 10,
          "fieldConfig": { "defaults": { "unit": "percent", "decimals": 0, "min": 0, "max": 100, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "yellow", "value": 60 }, { "color": "green", "value": 85 } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "background", "graphMode": "none", "textMode": "auto" },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT 100.0 * count(*) FILTER (WHERE position IN (SELECT waypoint FROM markets)) / NULLIF(count(*), 0) AS pct FROM ships WHERE role = 'SATELLITE'" } ]
        },
        {
          "type": "stat",
          "title": "Probes parked (idle)",
          "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 24 },
          "id": 11,
          "fieldConfig": { "defaults": { "unit": "short", "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "none", "graphMode": "none", "textMode": "auto" },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT count(*) AS n FROM ships WHERE role = 'SATELLITE' AND status = 'idle_wait'" } ]
        },
        {
          "type": "stat",
          "title": "Probes relocating (transit/exec)",
          "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 24 },
          "id": 12,
          "fieldConfig": { "defaults": { "unit": "short", "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null }, { "color": "yellow", "value": 40 } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none", "textMode": "auto" },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT count(*) AS n FROM ships WHERE role = 'SATELLITE' AND status IN ('transit', 'executing')" } ]
        },
        {
          "type": "stat",
          "title": "Distinct markets covered by a parked probe",
          "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 24 },
          "id": 13,
          "fieldConfig": { "defaults": { "unit": "short", "thresholds": { "mode": "absolute", "steps": [ { "color": "purple", "value": null } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "none", "graphMode": "none", "textMode": "auto" },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT count(DISTINCT position) AS n FROM ships WHERE role = 'SATELLITE' AND position IN (SELECT waypoint FROM markets)" } ]
        },
        {
          "type": "piechart",
          "title": "Probe (SATELLITE) status",
          "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 28 },
          "id": 14,
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": { "legend": { "displayMode": "table", "placement": "right", "values": ["value", "percent"] }, "pieType": "donut", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": true } },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT status, count(*) AS n FROM ships WHERE role = 'SATELLITE' GROUP BY 1 ORDER BY 2 DESC" } ]
        },
        {
          "type": "timeseries",
          "title": "scan_ships calls/min (rate-gated to 1/probe/30min)",
          "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 28 },
          "id": 15,
          "fieldConfig": { "defaults": { "unit": "cpm", "custom": { "drawStyle": "bars", "fillOpacity": 60, "lineWidth": 1, "showPoints": "never" } }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "single" } },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "time_series", "rawQuery": true, "rawSql": "SELECT to_timestamp(floor(ts/60)*60) AS time, count(*)::float AS scan_ships FROM api_requests WHERE $__unixEpochFilter(ts) AND endpoint ~ '/scan/ships$' GROUP BY 1 ORDER BY 1" } ]
        },
        {
          "type": "barchart",
          "title": "Parked probes per system (top 15)",
          "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 28 },
          "id": 16,
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "axisPlacement": "auto" } }, "overrides": [] },
          "options": { "orientation": "horizontal", "xField": "system", "showValue": "auto", "legend": { "showLegend": false } },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT regexp_replace(position, '-[^-]+$', '') AS system, count(*) AS probes FROM ships WHERE role = 'SATELLITE' AND position IN (SELECT waypoint FROM markets) GROUP BY 1 ORDER BY 2 DESC LIMIT 15" } ]
        }
      ]
    }
