              },
              "editorMode": "code",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "WITH p AS (SELECT ts, k.key AS purpose, k.value::bigint AS calls FROM fleet_snapshots, jsonb_each_text(api->'by_purpose') k WHERE $__timeFilter(ts) AND api IS NOT NULL), d AS (SELECT ts, purpose, calls - lag(calls) OVER w AS dc, extract(epoch FROM ts - lag(ts) OVER w) AS dt FROM p WINDOW w AS (PARTITION BY purpose ORDER BY ts)) SELECT ts AS time, purpose AS metric, greatest(dc, 0) / nullif(dt, 0) AS value FROM d WHERE dc IS NOT NULL ORDER BY 1"
            },
