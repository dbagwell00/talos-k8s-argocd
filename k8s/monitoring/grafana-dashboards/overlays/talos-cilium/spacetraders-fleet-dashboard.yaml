              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "WITH t AS (SELECT date_trunc('hour', ts) AS hour, regexp_match(label, 'trade ([A-Z_]+) (\\S+)->(\\S+) x([0-9]+) \\(\\+?(-?[0-9]+)\\)') AS m FROM orders_log WHERE $__timeFilter(ts) AND class = 'trade' AND outcome = 'ok') SELECT hour, m[1] AS good, m[2] || ' -> ' || m[3] AS lane, count(*) AS trips, sum(m[4]::int) AS units, sum(m[5]::bigint) AS profit, round(sum(m[5]::numeric) / greatest(sum(m[4]::int), 1)) AS per_unit FROM t WHERE m IS NOT NULL GROUP BY 1, 2, 3 ORDER BY 1 DESC, 6 DESC"
            }
