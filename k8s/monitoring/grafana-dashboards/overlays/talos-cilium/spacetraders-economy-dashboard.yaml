              "rawSql": "SELECT to_timestamp(floor(ts/300)*300) AS time, sum(CASE WHEN action='trade' THEN COALESCE(revenue,0)-COALESCE(profit,0) ELSE 0 END) AS \"Goods (cost of trade)\", sum(CASE WHEN action='purchase_ship' THEN COALESCE(revenue,0) ELSE 0 END) AS \"Ships\", sum(CASE WHEN action='refuel' THEN COALESCE(revenue,0) ELSE 0 END) AS \"Fuel\", sum(CASE WHEN action='jump' THEN COALESCE(revenue,0) ELSE 0 END) AS \"Antimatter (jumps)\", sum(CASE WHEN action IN ('construction_buy','supply_chain_deliver') AND COALESCE(profit,0) < 0 THEN -profit ELSE 0 END) AS \"Gate / feeds\" FROM events WHERE $__unixEpochFilter(ts) AND reset_id = '$reset' GROUP BY 1 ORDER BY 1"
