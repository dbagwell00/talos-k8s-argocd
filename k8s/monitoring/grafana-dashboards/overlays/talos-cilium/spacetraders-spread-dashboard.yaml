apiVersion: v1
kind: ConfigMap
metadata:
  name: spacetraders-spread-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "SpaceTraders"
data:
  spacetraders-spread.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["spacetraders", "spread"],
      "time": { "from": "now-6h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "SpaceTraders — Spread & Distribution",
      "uid": "spacetraders-spread",
      "version": 1,
      "templating": { "list": [ { "name": "reset", "label": "Reset", "type": "query", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "definition": "SELECT DISTINCT reset_id FROM events ORDER BY reset_id DESC", "query": "SELECT DISTINCT reset_id FROM events ORDER BY reset_id DESC", "refresh": 1, "sort": 0, "includeAll": false, "multi": false, "current": { "text": "2026-06-07", "value": "2026-06-07" } } ] },
      "panels": [
        {
          "type": "row",
          "title": "Hauler distribution — is the fleet spreading off the saturated clumps?",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "collapsed": false,
          "panels": []
        },
        {
          "type": "stat",
          "title": "Haulers (target: grow past 64)",
          "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "id": 1,
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "yellow", "value": null }, { "color": "green", "value": 65 } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none", "textMode": "auto" },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT count(*)::float AS haulers FROM ships WHERE role = 'HAULER'" } ]
        },
        {
          "type": "stat",
          "title": "Idle hauler % (target: fall from ~41%)",
          "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "id": 2,
          "fieldConfig": { "defaults": { "unit": "percent", "decimals": 0, "min": 0, "max": 100, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 20 }, { "color": "red", "value": 35 } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "background", "graphMode": "none", "textMode": "auto" },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT 100.0 * count(*) FILTER (WHERE status IN ('idle','idle_wait')) / NULLIF(count(*), 0) AS pct FROM ships WHERE role = 'HAULER'" } ]
        },
        {
          "type": "stat",
          "title": "Systems with a hauler (target: climb from ~44)",
          "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 },
          "id": 3,
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "yellow", "value": null }, { "color": "green", "value": 50 } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none", "textMode": "auto" },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT count(DISTINCT split_part(position,'-',1)||'-'||split_part(position,'-',2))::float AS systems FROM ships WHERE role = 'HAULER' AND position IS NOT NULL" } ]
        },
        {
          "type": "stat",
          "title": "Probes",
          "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 1 },
          "id": 4,
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none", "textMode": "auto" },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT count(*)::float AS probes FROM ships WHERE role = 'SATELLITE'" } ]
        },
        {
          "type": "stat",
          "title": "Probed systems (coverage breadth)",
          "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 1 },
          "id": 5,
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none", "textMode": "auto" },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT count(DISTINCT split_part(position,'-',1)||'-'||split_part(position,'-',2))::float AS systems FROM ships WHERE role = 'SATELLITE' AND position IS NOT NULL" } ]
        },
        {
          "type": "stat",
          "title": "Frontier SPREAD jumps (in range)",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 1 },
          "id": 6,
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "yellow", "value": null }, { "color": "green", "value": 1 } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "area", "textMode": "auto" },
          "targets": [ { "refId": "A", "datasource": { "type": "loki", "uid": "loki" }, "expr": "sum(count_over_time({app=\"spacetraders\",container=\"hub\"} |~ \"SPREAD\" [$__range]))", "editorMode": "code", "queryType": "instant" } ]
        },
        {
          "type": "row",
          "title": "Spread activity & reach",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 101,
          "collapsed": false,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Hauler relocation jumps / min (redistribution off saturated systems)",
          "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 6 },
          "id": 7,
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "drawStyle": "bars", "fillOpacity": 60, "lineWidth": 1, "showPoints": "never" } }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "single" } },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "time_series", "rawQuery": true, "rawSql": "SELECT to_timestamp(floor(ts/60)*60) AS time, count(*)::float AS relocations FROM decisions WHERE $__unixEpochFilter(ts) AND category = 'relocate' GROUP BY 1 ORDER BY 1" } ]
        },
        {
          "type": "timeseries",
          "title": "Distinct systems actively traded / 10 min (the spread payoff — should climb)",
          "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 6 },
          "id": 8,
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "drawStyle": "line", "fillOpacity": 30, "lineWidth": 2, "showPoints": "never" } }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "single" } },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "time_series", "rawQuery": true, "rawSql": "SELECT to_timestamp(floor(ts/600)*600) AS time, count(DISTINCT split_part(sell_wp,'-',1)||'-'||split_part(sell_wp,'-',2))::float AS systems_traded FROM events WHERE $__unixEpochFilter(ts) AND reset_id = '$reset' AND action = 'trade' AND sell_wp IS NOT NULL GROUP BY 1 ORDER BY 1" } ]
        },
        {
          "type": "row",
          "title": "Money — does spreading into the frontier earn more?",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 15 },
          "id": 102,
          "collapsed": false,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Net trade profit / 10 min",
          "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 16 },
          "id": 9,
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "drawStyle": "line", "fillOpacity": 30, "lineWidth": 2, "showPoints": "never" } }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "single" } },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "time_series", "rawQuery": true, "rawSql": "SELECT to_timestamp(floor(ts/600)*600) AS time, sum(profit)::float AS profit FROM events WHERE $__unixEpochFilter(ts) AND reset_id = '$reset' AND action = 'trade' GROUP BY 1 ORDER BY 1" } ]
        },
        {
          "type": "timeseries",
          "title": "Trades / 10 min",
          "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 16 },
          "id": 10,
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "drawStyle": "bars", "fillOpacity": 60, "lineWidth": 1, "showPoints": "never" } }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "single" } },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "time_series", "rawQuery": true, "rawSql": "SELECT to_timestamp(floor(ts/600)*600) AS time, count(*)::float AS trades FROM events WHERE $__unixEpochFilter(ts) AND reset_id = '$reset' AND action = 'trade' GROUP BY 1 ORDER BY 1" } ]
        },
        {
          "type": "row",
          "title": "Frontier monetization — which systems are lighting up",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 25 },
          "id": 103,
          "collapsed": false,
          "panels": []
        },
        {
          "type": "table",
          "title": "Systems by trade profit (in range) — newly-spread systems should appear here",
          "datasource": { "type": "postgres", "uid": "spacetraders-pg" },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 26 },
          "id": 11,
          "fieldConfig": { "defaults": { "custom": { "align": "auto" } }, "overrides": [ { "matcher": { "id": "byName", "options": "profit" }, "properties": [ { "id": "custom.cellOptions", "value": { "type": "color-background" } }, { "id": "thresholds", "value": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "yellow", "value": 1 }, { "color": "green", "value": 100000 } ] } } ] } ] },
          "options": { "showHeader": true, "sortBy": [ { "displayName": "profit", "desc": true } ] },
          "targets": [ { "refId": "A", "datasource": { "type": "postgres", "uid": "spacetraders-pg" }, "format": "table", "rawQuery": true, "rawSql": "SELECT split_part(sell_wp,'-',1)||'-'||split_part(sell_wp,'-',2) AS system, count(*) AS trades, sum(profit) AS profit, count(DISTINCT good) AS goods FROM events WHERE $__unixEpochFilter(ts) AND reset_id = '$reset' AND action = 'trade' AND sell_wp IS NOT NULL GROUP BY 1 ORDER BY profit DESC LIMIT 30" } ]
        }
      ]
    }
