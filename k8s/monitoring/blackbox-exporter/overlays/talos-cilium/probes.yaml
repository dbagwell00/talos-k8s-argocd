# One Probe per service so each carries a `service` label. HTTPS probes also
# export probe_ssl_earliest_cert_expiry, which covers cert-manager renewals.
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: homeassistant
  namespace: monitoring
  labels:
    release: prometheus-talos-cilium
spec:
  jobName: blackbox
  interval: 60s
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      labels:
        service: homeassistant
      static:
      - http://192.168.1.37:8123/manifest.json
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: blueiris
  namespace: monitoring
  labels:
    release: prometheus-talos-cilium
spec:
  jobName: blackbox
  interval: 60s
  module: http_up_or_401
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      labels:
        service: blueiris
      static:
      - http://192.168.1.44:8081/
