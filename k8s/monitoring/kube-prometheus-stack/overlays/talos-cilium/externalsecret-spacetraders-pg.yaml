# Read-only grafana_ro credential for the SpaceTraders PG cluster.
# Vault path: secret/spacetraders/pg  property: ro-password
#   (same Vault secret the app/pg roles live in; add the ro-password property there)
# Synced into the `grafana-st-pg` secret in the monitoring namespace and exposed
# to Grafana as the ST_PG_RO_PASSWORD env var (see values.yaml grafana.envValueFrom),
# which the PostgreSQL additionalDataSource interpolates as ${ST_PG_RO_PASSWORD}.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-st-pg
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-st-pg
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: ro-password
    remoteRef:
      key: spacetraders/pg
      property: ro-password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
