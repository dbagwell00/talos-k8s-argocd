# Grafana admin creds (Vault secret/grafana) -> grafana.admin.existingSecret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: admin-user
    remoteRef:
      key: grafana
      property: admin-user
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: admin-password
    remoteRef:
      key: grafana
      property: admin-password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
