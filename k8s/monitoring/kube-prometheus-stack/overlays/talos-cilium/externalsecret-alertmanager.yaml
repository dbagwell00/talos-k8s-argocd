# Alertmanager SMTP password (Vault secret/alertmanager) -> mounted into
# alertmanager pods (alertmanagerSpec.secrets) and read via smtp_auth_password_file.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-smtp
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-smtp
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: password
    remoteRef:
      key: alertmanager
      property: smtp-password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
