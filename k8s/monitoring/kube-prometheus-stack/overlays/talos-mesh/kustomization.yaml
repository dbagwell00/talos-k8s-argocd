apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
- name: kube-prometheus-stack
  repo: https://prometheus-community.github.io/helm-charts
  version: 65.7.0
  releaseName: prometheus-talos-mesh
  namespace: monitoring
  valuesFile: values.yaml
  includeCRDs: true

resources:
- namespace.yaml
