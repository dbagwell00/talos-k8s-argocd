# DaemonSet configuration
daemonset:
  enabled: true

# Loki client
config:
  clients:
    - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

  # Add syslog scrape config via snippets
  snippets:
    extraScrapeConfigs: |
      # Syslog receiver for UniFi devices
      - job_name: syslog
        syslog:
          listen_address: 0.0.0.0:1514
          listen_protocol: udp
          idle_timeout: 60s
          label_structured_data: yes
          syslog_format: rfc3164
          labels:
            job: syslog
        relabel_configs:
          - source_labels:
              - __syslog_message_hostname
            target_label: host
          - source_labels:
              - __syslog_message_app_name
            target_label: app
          - source_labels:
              - __syslog_message_facility
            target_label: facility
          - source_labels:
              - __syslog_message_severity
            target_label: severity
          - source_labels:
              - __syslog_connection_hostname
            target_label: source_ip
          - target_label: cluster
            replacement: unifi

# Extra ports for syslog
extraPorts:
  syslog:
    name: syslog
    containerPort: 1514
    protocol: UDP

# Resources
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Tolerations to run on all nodes
tolerations:
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
